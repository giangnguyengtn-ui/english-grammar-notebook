<title>Sổ Tay Tuần 1 — Ngữ Pháp & Từ Vựng Chuyên Sâu</title>
<style>
  :root{
    --paper:#EFF1EC; --paper-raised:#F8F9F6; --ink:#1E2B2A; --ink-soft:#52625F; --ink-faint:#7C8A86;
    --accent:#2F6F5E; --accent-strong:#1F4E42; --accent-tint:#DCE9E3;
    --gold:#9C6F1E; --gold-tint:#F1E4C9; --good:#3F8F52; --good-tint:#DEEEE0;
    --bad:#B5432E; --bad-tint:#F6E2DC; --line:#D6DAD3; --line-strong:#B7BdB5;
    --shadow: 0 1px 2px rgba(30,43,42,0.06), 0 6px 20px -8px rgba(30,43,42,0.18);
    --serif: "Iowan Old Style","Palatino Linotype",Georgia,ui-serif,serif;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono: "SF Mono","Cascadia Code",Consolas,"Roboto Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#141918; --paper-raised:#1B211F; --ink:#E9E7DD; --ink-soft:#A2AEA9; --ink-faint:#6E7975;
      --accent:#5FB79B; --accent-strong:#7FCBB1; --accent-tint:#1E332D;
      --gold:#D9A44C; --gold-tint:#332A17; --good:#5FBE7C; --good-tint:#1C2E20;
      --bad:#E0705A; --bad-tint:#33201B; --line:#2A322F; --line-strong:#3B4643;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -10px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141918; --paper-raised:#1B211F; --ink:#E9E7DD; --ink-soft:#A2AEA9; --ink-faint:#6E7975;
    --accent:#5FB79B; --accent-strong:#7FCBB1; --accent-tint:#1E332D;
    --gold:#D9A44C; --gold-tint:#332A17; --good:#5FBE7C; --good-tint:#1C2E20;
    --bad:#E0705A; --bad-tint:#33201B; --line:#2A322F; --line-strong:#3B4643;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -10px rgba(0,0,0,0.55);
  }
  :root[data-theme="light"]{
    --paper:#EFF1EC; --paper-raised:#F8F9F6; --ink:#1E2B2A; --ink-soft:#52625F; --ink-faint:#7C8A86;
    --accent:#2F6F5E; --accent-strong:#1F4E42; --accent-tint:#DCE9E3;
    --gold:#9C6F1E; --gold-tint:#F1E4C9; --good:#3F8F52; --good-tint:#DEEEE0;
    --bad:#B5432E; --bad-tint:#F6E2DC; --line:#D6DAD3; --line-strong:#B7BdB5;
    --shadow: 0 1px 2px rgba(30,43,42,0.06), 0 6px 20px -8px rgba(30,43,42,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--accent-tint); color:var(--accent-strong); }
  a{ color:var(--accent-strong); }

  .app{ display:grid; grid-template-columns: 232px 1fr; min-height:100vh; max-width:1220px; margin:0 auto; }
  @media (max-width: 780px){ .app{ grid-template-columns: 1fr; } }

  .rail{ border-right:1px solid var(--line); padding:28px 16px 20px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto; }
  @media (max-width:780px){
    .rail{ border-right:none; border-bottom:1px solid var(--line); flex-direction:row; align-items:center; overflow-x:auto; overflow-y:visible; padding:14px 12px; gap:12px; position:static; height:auto; }
  }
  .brand{ font-family:var(--serif); font-size:1.05rem; font-weight:600; letter-spacing:0.2px; display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .brand small{ font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; font-weight:500; }
  .week-progress{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); flex-shrink:0; }
  .week-progress .bar{ width:64px; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  @media (max-width:780px){ .week-progress .bar{ width:44px; } }
  .week-progress .fill{ height:100%; background:var(--accent); transition:width .4s ease; }

  .daylist{ display:flex; flex-direction:column; gap:3px; }
  @media (max-width:780px){ .daylist{ flex-direction:row; } }
  .day-tab{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:1px solid transparent; background:transparent; cursor:pointer; text-align:left; font-family:var(--sans); color:var(--ink-soft); transition:background .15s ease, color .15s ease, border-color .15s ease; white-space:nowrap; width:100%; }
  .day-tab:hover{ background:var(--paper-raised); }
  .day-tab:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .day-tab.active{ background:var(--accent-tint); color:var(--accent-strong); border-color:var(--accent-tint); }
  .day-tab .code{ font-family:var(--mono); font-size:0.72rem; font-weight:600; width:28px; flex-shrink:0; color:inherit; opacity:0.85; }
  .day-tab .tt{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .day-tab .tt b{ font-size:0.82rem; font-weight:600; }
  .day-tab .tt span{ font-size:0.7rem; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .day-tab.active .tt span{ color:var(--accent-strong); opacity:0.75; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--line-strong); flex-shrink:0; margin-left:auto; }
  .status-dot.progress{ background:var(--gold); }
  .status-dot.done{ background:var(--good); }
  .today-flag{ font-family:var(--mono); font-size:0.58rem; text-transform:uppercase; letter-spacing:0.06em; background:var(--gold-tint); color:var(--gold); padding:1px 5px; border-radius:4px; flex-shrink:0; }

  .rail-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  @media (max-width:780px){ .rail-foot{ display:none; } }
  .errlog-btn{ font-family:var(--sans); font-size:0.78rem; color:var(--ink-soft); background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:9px 10px; text-align:left; cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
  .errlog-btn:hover{ border-color:var(--line-strong); }
  .errlog-btn .n{ font-family:var(--mono); font-size:0.7rem; color:var(--ink-faint); background:var(--paper); border-radius:10px; padding:1px 7px; }

  .main{ padding:32px 40px 80px; min-width:0; }
  @media (max-width:780px){ .main{ padding:22px 18px 70px; } }

  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head h1{ font-family:var(--serif); font-weight:600; font-size:1.7rem; margin:0 0 4px; text-wrap:balance; }
  .eyebrow{ font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--accent); }
  .day-progress{ font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .day-progress .bar{ width:100px; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .day-progress .fill{ height:100%; background:var(--good); transition:width .35s ease; }

  section.block{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-bottom:20px; box-shadow:var(--shadow); }
  section.block h2{ font-family:var(--serif); font-size:1.12rem; font-weight:600; margin:0 0 14px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  section.block h2 .tag{ font-family:var(--mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint); font-weight:500; }
  section.block > p.intro{ color:var(--ink-soft); font-size:0.88rem; margin:-8px 0 16px; }

  /* grammar use-cards */
  .grammar-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .grammar-card{ border:1px solid var(--line); border-radius:10px; padding:16px 17px; background:var(--paper); }
  .grammar-card > .gname{ font-family:var(--serif); font-size:1.02rem; font-weight:600; color:var(--accent-strong); margin-bottom:10px; }
  .struct-table{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--line); }
  .struct-row{ display:grid; grid-template-columns:64px 1fr; gap:8px; align-items:baseline; }
  .struct-row .s-lbl{ font-family:var(--mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); }
  .struct-row .s-val{ font-family:var(--mono); font-size:0.82rem; color:var(--accent-strong); background:var(--accent-tint); border-radius:5px; padding:3px 8px; display:inline-block; }
  .use-item{ margin-bottom:12px; }
  .use-item:last-child{ margin-bottom:0; }
  .use-item .u-title{ font-size:0.87rem; font-weight:600; color:var(--ink); display:flex; gap:6px; align-items:baseline; }
  .use-item .u-title .n{ font-family:var(--mono); font-size:0.72rem; color:var(--accent); flex-shrink:0; }
  .use-item .u-note{ font-size:0.82rem; color:var(--ink-soft); margin:3px 0 6px; }
  .use-item .u-ex{ font-size:0.84rem; color:var(--ink); margin:3px 0 0 2px; padding-left:10px; border-left:2px solid var(--accent-tint); font-style:italic; }

  /* contrast */
  .contrast-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .contrast-row:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  @media (max-width:600px){ .contrast-row{ grid-template-columns:1fr; } }
  .contrast-cell{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .contrast-cell .lbl{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:4px; }
  .contrast-cell .sent{ font-size:0.87rem; color:var(--ink); }
  .contrast-explain{ grid-column:1 / -1; font-size:0.83rem; color:var(--accent-strong); background:var(--accent-tint); border-radius:7px; padding:8px 11px; margin-top:2px; }

  /* mistakes */
  .mistake-item{ padding:10px 0; border-top:1px solid var(--line); }
  .mistake-item:first-child{ border-top:none; padding-top:0; }
  .mistake-item .m-wrong{ color:var(--bad); font-size:0.88rem; text-decoration:line-through; }
  .mistake-item .m-right{ color:var(--good); font-size:0.9rem; font-weight:600; margin-top:3px; }
  .mistake-item .m-why{ color:var(--ink-soft); font-size:0.82rem; margin-top:4px; }

  /* reading links */
  .reading-links{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .reading-link{ display:flex; flex-direction:column; gap:2px; border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:9px 13px; text-decoration:none; flex:1 1 200px; }
  .reading-link:hover{ border-color:var(--accent); }
  .reading-link .rl-title{ font-size:0.86rem; font-weight:600; color:var(--ink); }
  .reading-link .rl-desc{ font-size:0.74rem; color:var(--ink-faint); }
  .reading-hint{ font-size:0.83rem; color:var(--ink-soft); background:var(--gold-tint); color:var(--gold); border-radius:7px; padding:9px 12px; }

  /* exercises */
  .ex{ padding:14px 0; border-top:1px solid var(--line); }
  .ex:first-of-type{ border-top:none; padding-top:0; }
  .ex .qn{ font-size:0.7rem; font-family:var(--mono); color:var(--ink-faint); margin-right:6px; }
  .ex .prompt{ color:var(--ink); font-size:0.94rem; }
  .blank-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .blank-row input[type="text"]{ font-family:var(--sans); font-size:0.92rem; background:var(--paper); color:var(--ink); border:1px solid var(--line-strong); border-radius:7px; padding:6px 10px; min-width:170px; transition:border-color .15s ease, background .15s ease; }
  .blank-row input[type="text"]:focus-visible{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
  .blank-row input.correct{ border-color:var(--good); background:var(--good-tint); }
  .blank-row input.wrong{ border-color:var(--bad); background:var(--bad-tint); }
  .fb-icon{ font-family:var(--mono); font-size:0.85rem; }
  .fb-icon.ok{ color:var(--good); }
  .fb-icon.no{ color:var(--bad); }
  .reveal-text{ font-size:0.85rem; color:var(--ink-soft); margin-top:6px; display:none; background:var(--paper); border-left:3px solid var(--accent); padding:8px 11px; border-radius:0 7px 7px 0; }
  .reveal-text.show{ display:block; }
  .reveal-text b{ color:var(--accent-strong); }

  .corr-item{ margin-top:8px; }
  .corr-item .orig{ font-size:0.9rem; color:var(--ink-soft); font-style:italic; }
  .corr-answer{ margin-top:6px; padding:9px 11px; background:var(--accent-tint); color:var(--accent-strong); border-radius:7px; font-size:0.88rem; display:none; }
  .corr-answer.show{ display:block; }

  button{ font-family:var(--sans); cursor:pointer; }
  .btn{ font-size:0.82rem; font-weight:600; background:var(--accent); color:#fff; border:none; border-radius:7px; padding:8px 14px; transition:background .15s ease, transform .08s ease; }
  .btn:hover{ background:var(--accent-strong); }
  .btn:active{ transform:translateY(1px); }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong); }
  .btn.ghost:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .btn.small{ padding:5px 10px; font-size:0.74rem; }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .score-pill{ font-family:var(--mono); font-size:0.78rem; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:4px 12px; display:inline-flex; align-items:center; gap:6px; }
  .score-pill b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  /* vocab accordion */
  .vocab-stats{ font-family:var(--mono); font-size:0.76rem; color:var(--ink-soft); margin-bottom:12px; }
  .vocab-item{ border:1px solid var(--line); border-radius:10px; margin-bottom:10px; background:var(--paper); overflow:hidden; }
  .vocab-item.mastered{ border-color:var(--good); }
  .vocab-head{ display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; }
  .vocab-head .term{ font-family:var(--serif); font-size:1.03rem; font-weight:600; color:var(--ink); }
  .vocab-head .ipa{ font-family:var(--mono); font-size:0.78rem; color:var(--ink-faint); }
  .vocab-head .pos-badge{ font-family:var(--mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.04em; background:var(--accent-tint); color:var(--accent-strong); padding:2px 7px; border-radius:4px; }
  .vocab-head .reg-badge{ font-family:var(--mono); font-size:0.65rem; color:var(--gold); background:var(--gold-tint); padding:2px 7px; border-radius:4px; }
  .vocab-head .mastered-check{ color:var(--good); font-size:0.9rem; margin-left:auto; flex-shrink:0; }
  .vocab-play{ background:none; border:1px solid var(--line); border-radius:6px; padding:2px 7px; font-size:0.85rem; flex-shrink:0; color:var(--ink-soft); }
  .vocab-play:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .vocab-head .chevron{ margin-left:auto; color:var(--ink-faint); font-size:0.8rem; flex-shrink:0; transition:transform .2s ease; }
  .vocab-item.open .chevron{ transform:rotate(180deg); }
  .vocab-item.open .mastered-check{ margin-left:8px; }
  .vocab-body{ display:none; padding:0 14px 16px; border-top:1px solid var(--line); }
  .vocab-item.open .vocab-body{ display:block; }
  .vf-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; font-size:0.85rem; }
  .vf-row .k{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); width:100%; margin-bottom:2px; }
  .vf-fam{ display:flex; gap:14px; flex-wrap:wrap; }
  .vf-fam span b{ color:var(--ink-faint); font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; margin-right:4px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ background:var(--accent-tint); color:var(--accent-strong); border-radius:12px; padding:3px 10px; font-size:0.8rem; }
  .chip.ant{ background:var(--bad-tint); color:var(--bad); }
  .pattern-box{ font-family:var(--mono); font-size:0.82rem; color:var(--accent-strong); background:var(--accent-tint); border-radius:6px; padding:6px 10px; display:inline-block; }
  .ex-line{ font-size:0.87rem; color:var(--ink); font-style:italic; padding:8px 10px; background:var(--paper-raised); border-radius:6px; margin-top:4px; }
  .ex-line .tag2{ font-family:var(--mono); font-style:normal; font-size:0.65rem; text-transform:uppercase; color:var(--ink-faint); margin-right:6px; }
  .vocab-actions{ display:flex; gap:6px; margin-top:14px; }

  /* writing */
  textarea{ width:100%; min-height:150px; resize:vertical; font-family:var(--sans); font-size:0.94rem; line-height:1.6; background:var(--paper); color:var(--ink); border:1px solid var(--line-strong); border-radius:8px; padding:12px 14px; }
  textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:0; }
  .write-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-family:var(--mono); font-size:0.75rem; color:var(--ink-faint); }
  .write-foot label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); cursor:pointer; }
  .write-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .write-report{ margin-top:14px; padding:14px 16px; background:var(--paper); border:1px solid var(--line); border-radius:9px; }
  .write-report .wr-title{ font-family:var(--serif); font-size:0.94rem; font-weight:600; color:var(--accent-strong); margin-bottom:8px; }
  .write-report .wr-line{ font-size:0.86rem; color:var(--ink-soft); margin-bottom:10px; }
  .write-report .wr-sub{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin:12px 0 6px; }
  .check-grid{ display:flex; flex-wrap:wrap; gap:6px; }
  .check-item{ font-size:0.8rem; border-radius:12px; padding:3px 10px; background:var(--paper-raised); color:var(--ink-faint); border:1px solid var(--line); }
  .check-item.ok{ color:var(--good); border-color:var(--good); background:var(--good-tint); }
  .check-item.no{ color:var(--ink-faint); }
  .warn-item{ border-left:3px solid var(--bad); background:var(--bad-tint); border-radius:0 7px 7px 0; padding:8px 11px; margin-bottom:8px; }
  .warn-item .w-snip{ font-size:0.85rem; color:var(--ink); font-style:italic; }
  .warn-item .w-tip{ font-size:0.8rem; color:var(--bad); margin-top:3px; }
  .dict-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .shadow-row{ display:flex; flex-direction:column; gap:6px; }
  .shadow-row .prompt{ font-style:italic; }
  .prompt-box{ background:var(--gold-tint); color:var(--gold); border-radius:8px; padding:12px 14px; font-size:0.9rem; margin-bottom:12px; line-height:1.5; }
  .prompt-box b{ display:block; margin-bottom:2px; color:inherit; font-family:var(--serif); font-size:0.96rem; }

  .review-list{ display:flex; flex-direction:column; gap:6px; }
  .review-list .item{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:0.88rem; }
  .review-list .item:first-child{ border-top:none; }

  .errlog-overlay{ position:fixed; inset:0; background:rgba(20,25,24,0.45); display:none; align-items:flex-start; justify-content:flex-end; z-index:50; padding:0; }
  .errlog-overlay.open{ display:flex; }
  .errlog-panel{ width:min(400px, 100%); height:100%; background:var(--paper-raised); border-left:1px solid var(--line); padding:22px 22px 30px; overflow-y:auto; box-shadow:var(--shadow); position:relative; }
  .errlog-panel h3{ font-family:var(--serif); font-size:1.15rem; margin:0 0 4px; }
  .errlog-panel .sub{ font-size:0.82rem; color:var(--ink-soft); margin-bottom:16px; }
  .errlog-form{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .errlog-form input, .errlog-form textarea{ font-family:var(--sans); font-size:0.86rem; background:var(--paper); border:1px solid var(--line-strong); border-radius:7px; padding:8px 10px; color:var(--ink); }
  .errlog-form textarea{ min-height:50px; }
  .errlog-entries{ display:flex; flex-direction:column; gap:10px; }
  .errlog-entry{ border:1px solid var(--line); border-radius:8px; padding:10px 12px; position:relative; background:var(--paper); }

/* ---------------- listening (TTS) & speaking (speech recognition) ---------------- */

function speak(text, rate){
  if(!window.speechSynthesis) return false;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate || 1;
  window.speechSynthesis.speak(u);
  return true;
}

var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;

function scoreOverlap(target, said){
  function toWords(s){ return normalize(s).replace(/[^a-z0-9'\s]/gi,"").split(/\s+/).filter(Boolean); }
  var t = toWords(target), sd = toWords(said);
  if(!t.length) return 0;
  var bag = {};
  sd.forEach(function(w){ bag[w] = (bag[w]||0)+1; });
  var match = 0;
  t.forEach(function(w){ if(bag[w]>0){ match++; bag[w]--; } });
  return Math.round(100*match/t.length);
}

function startRecording(onInterim, onFinal, onError){
  if(!SpeechRec) { if(onError) onError("unsupported"); return null; }
  var rec = new SpeechRec();
  rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
  var finalText = "";
  rec.onresult = function(e){
    var interim = "";
    for(var i=e.resultIndex; i<e.results.length; i++){
      var tr = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += tr; else interim += tr;
    }
    onInterim(finalText + interim);
  };
  rec.onerror = function(e){ if(onError) onError(e.error); };
  rec.onend = function(){ onFinal(finalText.trim()); };
  try{ rec.start(); }catch(e){ if(onError) onError("start-failed"); return null; }
  return rec;
}

function buildDictationSentences(day){
  return day.blanks.map(function(b){
    var ansParts = b.a[0].split(/,\s*|\s\/\s/);
    var parts = b.p.split("___");
    var out = parts[0];
    for(var i=0;i<ansParts.length;i++){ out += ansParts[i] + (parts[i+1]!==undefined ? parts[i+1] : ""); }
    return out.replace(/___/g,"...").replace(/\s+/g," ").trim();
  });
}

var PS3SG = ["goes","does","has","works","lives","likes","wants","needs","studies","tries","watches","gets","makes","takes","comes","knows","thinks","believes","seems","looks","feels","means","keeps","starts","closes","opens","leaves","arrives","begins","plays","runs","reads","writes","spends","earns","saves","invests","grows","rises","falls","increases","decreases","costs","pays"];
var IRREG_PAST = ["went","saw","did","had","said","got","made","took","came","knew","thought","found","gave","told","became","showed","left","felt","brought","began","bought","sold","spent","earned","rose","fell","grew","lost","won","paid","held","kept","meant","understood","wrote","spoke","broke","chose","drove","ate","ran","sat","stood","heard","met","built","read"];
var PART = "(?:\\w+ed|\\w+en|been|gone|done|seen|made|taken|known|given|come|found|said|told|thought|shown|written|begun|bought|sold|spent|chosen|driven|run|sat|stood|heard|met|built|read|held|kept|meant|understood|grown|risen|fallen|lost|won|paid|felt)";
var STATIVE = ["knowing","understanding","believing","wanting","needing","loving","liking","hating","preferring","owning","belonging","seeming","realizing","recognizing","remembering","forgetting","meaning","doubting","supposing","containing","consisting","involving","requiring","resembling","depending"];

function getTenseRegex(name){
  var base = (name||"").replace(/\s*\(.*?\)\s*/g,"").trim();
  switch(base){
    case "Present Simple": return new RegExp("\\b(" + PS3SG.join("|") + "|always|usually|often|sometimes|rarely|never|generally|normally)\\b","i");
    case "Present Continuous": return /\b(?:am|is|are)\s+(?!going\s+to\b)\w+ing\b/i;
    case "Past Simple": return new RegExp("\\b(" + IRREG_PAST.join("|") + ")\\b|\\b\\w+ed\\b","i");
    case "Present Perfect": return new RegExp("\\b(?:have|has)\\s+(?:just|already|never|ever|recently|possibly|certainly|not\\s+)?" + PART + "\\b","i");
    case "Present Perfect Continuous": return /\b(?:have|has)\s+been\s+\w+ing\b/i;
    case "Past Perfect": return new RegExp("\\bhad\\s+(?:just|already|never|ever|not\\s+)?" + PART + "\\b","i");
    case "Past Perfect Continuous": return /\bhad\s+been\s+\w+ing\b/i;
    case "will": return /\b(will|won't|'ll)\b/i;
    case "going to": return /\b(?:am|is|are)\s+going\s+to\b/i;
    case "Future Continuous": return /\bwill\s+be\s+\w+ing\b/i;
    default: return null;
  }
}

function splitSentences(text){
  return (text||"").split(/(?<=[.!?])\s+/).map(function(s){return s.trim();}).filter(Boolean);
}

function scanMistakes(text){
  var warnings = [];
  var sentences = splitSentences(text);
  var stativeRe = new RegExp("\\b(?:am|is|are|was|were|been|being)\\s+(" + STATIVE.join("|") + ")\\b","i");
  var pastMarkerRe = /\b(yesterday|ago|last\s+\w+|in\s+(19|20)\d{2})\b/i;
  var havePerfectRe = /\b(have|has)\b(?!\s*n't)(?!\s+to\b)/i;
  var timeClauseWillRe = /\b(when|after|before|until|as soon as)\b[^,.!?]*\bwill\b/i;
  sentences.forEach(function(s){
    if(stativeRe.test(s)){
      warnings.push({snippet:s, tip:"Có thể đang dùng thì tiếp diễn với động từ trạng thái (stative verb) — các động từ như know/understand/want/love/own... thường không chia tiếp diễn."});
    }
    if(havePerfectRe.test(s) && pastMarkerRe.test(s) && !/\bhave\s+to\b/i.test(s)){
      warnings.push({snippet:s, tip:"Câu có 'have/has' kèm mốc thời gian xác định (yesterday/ago/last.../in năm...) — kiểm tra lại, mốc thời gian xác định thường đi với Past Simple, không phải Present Perfect."});
    }
    if(timeClauseWillRe.test(s)){
      warnings.push({snippet:s, tip:"Trong mệnh đề thời gian sau when/after/before/until/as soon as, thường không dùng 'will' — kiểm tra lại xem có bị lặp 'will' không."});
    }
  });
  return warnings;
}

function analyzeWriting(day, text, vocabListOverride){
  var words = (text.trim().match(/\S+/g)||[]).length;
  var tenseHits = [];
  if(day.grammar && day.grammar.length){
    day.grammar.forEach(function(g){
      var re = getTenseRegex(g.name);
      if(re) tenseHits.push({name:g.name, used: re.test(text)});
    });
  }
  var vocabList = vocabListOverride || day.vocab || [];
  var vocabHits = vocabList.map(function(v){
    var stem = v.t.split(/[\/(]/)[0].trim().split(" ")[0];
    var re = new RegExp("\\b" + stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\w*", "i");
    return { term:v.t, used: re.test(text) };
  });
  var warnings = scanMistakes(text);
  return { words:words, tenseHits:tenseHits, vocabHits:vocabHits, warnings:warnings };
}

function dayStatus(d){
  var blankTotal = d.blanks.length, blankDone = 0;
  d.blanks.forEach(function(b,i){ if(isCorrect(state.blanks[d.key+"-b"+i]||"", b.a)) blankDone++; });

  var vocabTotal = d.vocab.length, vocabMastered = 0;
  d.vocab.forEach(function(v,i){ if(state.vocab[d.key+"-v"+i]==="known") vocabMastered++; });

  var writingLen = (state.writing[d.key]||"").trim().split(/\s+/).filter(Boolean).length;
  var hasWriting = !!d.writing && d.type!=="review";
  var writeOk = hasWriting ? (writingLen >= 25) : true;

  var pieces = blankTotal + vocabTotal + (hasWriting?1:0);
  var piecesDone = blankDone + vocabMastered + (hasWriting && writeOk ? 1:0);
  var pct = pieces>0 ? Math.round(100*piecesDone/pieces) : 0;
  var started = blankDone>0 || vocabMastered>0 || writingLen>0 || d.blanks.some(function(b,i){ return !!state.blanks[d.key+"-b"+i]; });

  return { pct:pct, complete: pieces>0 && piecesDone>=pieces, started: started };
}

      row.appendChild(inputRow); row.appendChild(revealEl);
      lisSec.appendChild(row);
    });
    main.appendChild(lisSec);
  }

  // vocab
  if(vocabSource.length){
    var vocSec = el("section","block");
    var masteredCount = vocabSource.filter(function(v){ return state.vocab[v._src+"-v"+v._idx]==="known"; }).length;
    vocSec.appendChild(el("h2",null,'Từ vựng hệ thống hóa '+(isConsolidate?"— ôn tập cả tuần":"")+' <span class="tag">bấm để xem chi tiết</span>'));
    vocSec.appendChild(el("div","vocab-stats","Đã thuộc "+masteredCount+" / "+vocabSource.length+" từ"));

    vocabSource.forEach(function(v){
      var k = v._src+"-v"+v._idx;
      var mastered = state.vocab[k]==="known";
      var openKey = (isConsolidate?"sun-":"")+k;
      var isOpen = !!state.vocabOpen[openKey];
      var item = el("div","vocab-item"+(mastered?" mastered":"")+(isOpen?" open":""));

      var famParts = [];
      if(v.fam){ ["n","v","adj","adv"].forEach(function(kk){ if(v.fam[kk]) famParts.push('<span><b>'+kk.toUpperCase()+'</b>'+v.fam[kk]+'</span>'); }); }

      var head = el("div","vocab-head",
        '<span class="term">'+v.t+'</span>'+
        '<span class="ipa">'+(v.ipa||"")+'</span>'+
        '<span class="pos-badge">'+v.pos+'</span>'+
        '<span class="reg-badge">'+v.reg+'</span>'+
        (mastered ? '<span class="mastered-check">✓</span>' : '')+
        '<span class="chevron">▾</span>');
      if(window.speechSynthesis){
        var playTermBtn = el("button","vocab-play","🔊");
        playTermBtn.title = "Nghe phát âm";
        playTermBtn.addEventListener("click", function(e){ e.stopPropagation(); speak(v.t.replace(/\(.*?\)/g,""), 0.9); });
        head.appendChild(playTermBtn);
      }
      var body = el("div","vocab-body",
        '<div class="vf-row"><span class="k">Nghĩa</span>'+v.m+'</div>'+
        (v.pattern ? '<div class="vf-row"><span class="k">Cấu trúc</span><span class="pattern-box">'+v.pattern+'</span></div>' : '')+
        (famParts.length ? '<div class="vf-row"><span class="k">Họ từ (word family)</span><div class="vf-fam">'+famParts.join("")+'</div></div>' : '')+
        (v.colloc && v.colloc.length ? '<div class="vf-row"><span class="k">Cụm từ đi kèm (collocations)</span><div class="chips">'+v.colloc.map(function(c){return '<span class="chip">'+c+'</span>';}).join("")+'</div></div>' : '')+
        (v.syn && v.syn.length ? '<div class="vf-row"><span class="k">Đồng nghĩa</span><div class="chips">'+v.syn.map(function(s){return '<span class="chip">'+s+'</span>';}).join("")+'</div></div>' : '')+
        (v.ant && v.ant.length ? '<div class="vf-row"><span class="k">Trái nghĩa</span><div class="chips">'+v.ant.map(function(a){return '<span class="chip ant">'+a+'</span>';}).join("")+'</div></div>' : '')+
        (v.speak ? '<div class="vf-row"><span class="k">Ví dụ khi nói (informal)</span><div class="ex-line"><span class="tag2">speak</span>'+v.speak+'</div></div>' : '')+
        (v.write ? '<div class="vf-row"><span class="k">Ví dụ khi viết (formal)</span><div class="ex-line"><span class="tag2">write</span>'+v.write+'</div></div>' : '')
      );
      var actions = el("div","vocab-actions");
      var knowBtn = el("button","btn small", mastered ? "✓ Đã thuộc" : "Đã thuộc");
      var againBtn = el("button","btn ghost small","Ôn lại");
      knowBtn.addEventListener("click", function(e){ e.stopPropagation(); state.vocab[k]="known"; save(); renderMain(); renderRail(); });
      againBtn.addEventListener("click", function(e){ e.stopPropagation(); state.vocab[k]="seen"; save(); renderMain(); renderRail(); });
      actions.appendChild(knowBtn); actions.appendChild(againBtn);
      body.appendChild(actions);

      head.addEventListener("click", function(){
        state.vocabOpen[openKey] = !state.vocabOpen[openKey];
        save();
        item.classList.toggle("open");
      });
      item.appendChild(head); item.appendChild(body);
      vocSec.appendChild(item);
    });
    main.appendChild(vocSec);
  }

  // speaking
  if((dictationSentences.length) || (d.speaking && d.speaking.length)){
    var spkSec = el("section","block");
    spkSec.appendChild(el("h2",null,'Luyện nói <span class="tag">shadowing &amp; trả lời</span>'));
    if(!SpeechRec){
      spkSec.appendChild(el("div","empty-note","Trình duyệt của bạn không hỗ trợ nhận diện giọng nói (Speech Recognition). Hãy dùng Chrome hoặc Edge trên máy tính/Android, hoặc gõ câu trả lời vào ô bên dưới thay vì ghi âm."));
    }

    if(dictationSentences.length){
      spkSec.appendChild(el("div","wr-sub","Shadowing — nghe rồi nói lại y hệt"));
      dictationSentences.slice(0,4).forEach(function(sentence, i){
        var row = el("div","ex shadow-row");
        row.appendChild(el("div","prompt",'"'+sentence+'"'));
        var ctr = el("div","dict-controls");
        var playBtn = el("button","btn small","🔊 Nghe");
        playBtn.addEventListener("click", function(){ speak(sentence, 0.95); });
        ctr.appendChild(playBtn);
        var result = el("span","score-pill","");
        result.style.display = "none";
        if(SpeechRec){
          var recBtn = el("button","btn ghost small","🎤 Nói theo");
          var active = null;
          recBtn.addEventListener("click", function(){
            if(active){ active.stop(); return; }
            recBtn.textContent = "⏹ Đang nghe...";
            active = startRecording(function(){}, function(finalText){
              recBtn.textContent = "🎤 Nói theo";
              active = null;
              if(finalText){
                var sc = scoreOverlap(sentence, finalText);
                result.style.display = "inline-flex";
                result.innerHTML = 'Bạn nói: "'+finalText+'" — khớp <b>'+sc+'%</b>';
              }
            }, function(err){
              recBtn.textContent = "🎤 Nói theo"; active = null;
              result.style.display="inline-flex"; result.textContent = err==="not-allowed" ? "Chưa cấp quyền micro" : "Không nhận diện được, thử lại";
            });
          });
          ctr.appendChild(recBtn);
        }
        row.appendChild(ctr);
        row.appendChild(result);
        spkSec.appendChild(row);
      });
    }

    if(d.speaking && d.speaking.length){
      spkSec.appendChild(el("div","wr-sub","Trả lời câu hỏi nói (ghi âm hoặc gõ)"));
      d.speaking.forEach(function(q, i){
        var qk = d.key+"-q"+i;
        var qWrap = el("div","ex");
        qWrap.appendChild(el("div","prompt",'<span class="qn">'+(i+1)+'.</span>'+q));
        var ctr = el("div","dict-controls");
        var ta2 = document.createElement("textarea");
        ta2.placeholder = "Transcript câu trả lời của bạn sẽ hiện ở đây — có thể tự gõ/sửa...";
        ta2.style.minHeight = "60px"; ta2.style.marginTop = "8px";
        ta2.value = state.speaking[qk] || "";
        ta2.addEventListener("input", function(){ state.speaking[qk]=ta2.value; save(); });
        if(SpeechRec){
          var recBtn2 = el("button","btn small","🎤 Ghi âm trả lời");
          var active2 = null;
          recBtn2.addEventListener("click", function(){
            if(active2){ active2.stop(); return; }
            recBtn2.textContent = "⏹ Đang nghe...";
            active2 = startRecording(function(interim){ ta2.value = interim; }, function(finalText){
              recBtn2.textContent = "🎤 Ghi âm trả lời"; active2 = null;
              if(finalText){ ta2.value = finalText; state.speaking[qk]=finalText; save(); }
            }, function(){
              recBtn2.textContent = "🎤 Ghi âm trả lời"; active2 = null;
            });
          });
          ctr.appendChild(recBtn2);
        }
        qWrap.appendChild(ctr);
        qWrap.appendChild(ta2);
        spkSec.appendChild(qWrap);
      });
    }
    main.appendChild(spkSec);
  }

  // writing
  if(d.writing && d.type !== "review"){
    var wSec = el("section","block");
    wSec.appendChild(el("h2",null,'Luyện viết <span class="tag">output</span>'));
    wSec.appendChild(el("div","prompt-box","<b>Đề bài</b>"+d.writing));
    var ta = document.createElement("textarea");
    ta.placeholder = "Viết câu trả lời của bạn ở đây — tự động lưu...";
    ta.value = state.writing[d.key] || "";
    wSec.appendChild(ta);
    var foot = el("div","write-foot");
    var wc = document.createElement("span");
    function wordCount(){ return (ta.value.trim().match(/\S+/g)||[]).length; }
    wc.textContent = wordCount()+" từ";
    var label = document.createElement("label");
    var cb = document.createElement("input"); cb.type="checkbox"; cb.checked = !!state.writeDone[d.key];
    label.appendChild(cb); label.appendChild(document.createTextNode(" Đánh dấu hoàn thành"));
    foot.appendChild(wc); foot.appendChild(label);
    wSec.appendChild(foot);
    var timer;
    ta.addEventListener("input", function(){
      wc.textContent = wordCount()+" từ";
      clearTimeout(timer);
      timer = setTimeout(function(){ state.writing[d.key]=ta.value; save(); renderRail(); }, 400);
    });
    cb.addEventListener("change", function(){ state.writeDone[d.key]=cb.checked; save(); });

    var wActions = el("div","write-actions");
    var checkBtn = el("button","btn small","Chấm bài (tự động, offline)");
    var copyBtn = el("button","btn ghost small","Sao chép + nhờ Claude chấm chi tiết");
    wActions.appendChild(checkBtn); wActions.appendChild(copyBtn);
    wSec.appendChild(wActions);

    var reportBox = el("div","write-report");
    reportBox.style.display = "none";
    wSec.appendChild(reportBox);

    checkBtn.addEventListener("click", function(){
      var vocabForCheck = isConsolidate ? vocabSource : d.vocab;
      var rep = analyzeWriting(d, ta.value, vocabForCheck);
      var html = "";
      html += '<div class="wr-title">Kết quả chấm nhanh (heuristic — chỉ mang tính gợi ý, không thay thế chấm thật)</div>';
      html += '<div class="wr-line"><b>' + rep.words + '</b> từ (mục tiêu: xem đề bài phía trên)</div>';
      if(rep.tenseHits.length){
        html += '<div class="wr-sub">Các thì đã dùng</div><div class="check-grid">';
        rep.tenseHits.forEach(function(t){
          html += '<span class="check-item ' + (t.used?"ok":"no") + '">' + (t.used?"✓":"✗") + ' ' + t.name + '</span>';
        });
        html += '</div>';
      }
      var usedVocabCount = rep.vocabHits.filter(function(v){return v.used;}).length;
      html += '<div class="wr-sub">Từ vựng đã dùng (' + usedVocabCount + '/' + rep.vocabHits.length + ')</div><div class="check-grid">';
      rep.vocabHits.forEach(function(v){
        html += '<span class="check-item ' + (v.used?"ok":"no") + '">' + (v.used?"✓":"·") + ' ' + v.term + '</span>';
      });
      html += '</div>';
      if(rep.warnings.length){
        html += '<div class="wr-sub">Cảnh báo ngữ pháp cần xem lại (' + rep.warnings.length + ')</div>';
        rep.warnings.forEach(function(w){
          html += '<div class="warn-item"><div class="w-snip">"' + w.snippet + '"</div><div class="w-tip">' + w.tip + '</div></div>';
        });
      } else {
        html += '<div class="wr-sub">Cảnh báo ngữ pháp</div><div class="empty-note">Không phát hiện lỗi nào trong danh sách lỗi thường gặp đã kiểm tra — nhưng công cụ này chỉ dò được vài mẫu lỗi cố định, không phải kiểm tra ngữ pháp đầy đủ. Nên dùng nút "Sao chép + nhờ Claude chấm chi tiết" để được chấm kỹ hơn.</div>';
      }
      reportBox.innerHTML = html;
      reportBox.style.display = "block";
    });

    copyBtn.addEventListener("click", function(){
      var prompt = "Hãy chấm bài viết tiếng Anh sau của tôi (đề bài: " + d.writing.replace(/<[^>]+>/g,"") + "). Tập trung vào ngữ pháp các thì đã học (Present Simple/Continuous, Past Simple, Present Perfect/Continuous, Past Perfect/Continuous, các thì tương lai). Chỉ ra lỗi sai cụ thể, sửa lại đúng, và giải thích ngắn gọn vì sao sai.\n\n---\n" + ta.value;
      function done(ok){
        copyBtn.textContent = ok ? "Đã copy — dán vào chat với Claude!" : "Không copy được, hãy tự chọn & copy";
        setTimeout(function(){ copyBtn.textContent = "Sao chép + nhờ Claude chấm chi tiết"; }, 2500);
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(prompt).then(function(){done(true);}, function(){done(false);});
      } else { done(false); }
    });

    main.appendChild(wSec);
  }

  // consolidate: error log summary
  if(isConsolidate){
    var errSec = el("section","block");
    errSec.appendChild(el("h2",null,'Error Log của tuần <span class="tag">'+state.errlog.length+' mục</span>'));
    if(state.errlog.length===0){
      errSec.appendChild(el("div","empty-note","Chưa có mục nào — dùng nút Error Log ở góc dưới phải để ghi lại lỗi sai trong tuần."));
    } else {
      var rl = el("div","review-list");
      state.errlog.forEach(function(en){
        rl.appendChild(el("div","item",'<span style="text-decoration:line-through;color:var(--bad)">'+en.wrong+'</span><span style="color:var(--good);font-weight:600">'+en.right+'</span>'));
      });
      errSec.appendChild(rl);
    }
    main.appendChild(errSec);
  }
}

function renderAll(){ renderRail(); renderMain(); }

/* ---------------- error log panel ---------------- */
function renderErrLog(){
  var wrap = document.getElementById("errlogEntries");
  wrap.innerHTML = "";
  if(state.errlog.length===0){ wrap.innerHTML = '<div class="empty-note">Chưa có mục nào.</div>'; return; }
  state.errlog.slice().reverse().forEach(function(en){
    var e = el("div","errlog-entry",
      '<button class="del" title="Xoá">✕</button>'+
      '<div class="wrong">'+en.wrong+'</div>'+
      '<div class="right">'+en.right+'</div>'+
      (en.why ? '<div class="why">'+en.why+'</div>' : ''));
    e.querySelector(".del").addEventListener("click", function(){
      var idx = state.errlog.indexOf(en);
      if(idx>-1){ state.errlog.splice(idx,1); save(); renderErrLog(); renderRail(); }
    });
    wrap.appendChild(e);
  });
}
function openErrLog(){ document.getElementById("errlogOverlay").classList.add("open"); renderErrLog(); }
function closeErrLog(){ document.getElementById("errlogOverlay").classList.remove("open"); }

document.getElementById("openErrLog").addEventListener("click", openErrLog);
document.getElementById("fabErrLog").addEventListener("click", openErrLog);
document.getElementById("closeErrLog").addEventListener("click", closeErrLog);
document.getElementById("errlogOverlay").addEventListener("click", function(e){ if(e.target===this) closeErrLog(); });
document.getElementById("ef-add").addEventListener("click", function(){
  var w = document.getElementById("ef-wrong").value.trim();
  var r = document.getElementById("ef-right").value.trim();
  var y = document.getElementById("ef-why").value.trim();
  if(!w || !r) return;
  state.errlog.push({wrong:w, right:r, why:y});
  save();
  document.getElementById("ef-wrong").value=""; document.getElementById("ef-right").value=""; document.getElementById("ef-why").value="";
  renderErrLog(); renderRail();
});

if(!state.current){
  var todayDay = DAYS.find(function(d){ return d.weekday===todayWeekday; });
  state.current = todayDay ? todayDay.key : DAYS[0].key;
}
renderAll();

})();
</script>
