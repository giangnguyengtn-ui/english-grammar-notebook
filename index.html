<title>Sổ Tay Tuần 1 — Ngữ Pháp & Từ Vựng Chuyên Sâu</title>
<style>
  :root{
    --paper:#EFF1EC; --paper-raised:#F8F9F6; --ink:#1E2B2A; --ink-soft:#52625F; --ink-faint:#7C8A86;
    --accent:#2F6F5E; --accent-strong:#1F4E42; --accent-tint:#DCE9E3;
    --gold:#9C6F1E; --gold-tint:#F1E4C9; --good:#3F8F52; --good-tint:#DEEEE0;
    --bad:#B5432E; --bad-tint:#F6E2DC; --line:#D6DAD3; --line-strong:#B7BdB5;
    --shadow: 0 1px 2px rgba(30,43,42,0.06), 0 6px 20px -8px rgba(30,43,42,0.18);
    --serif: "Iowan Old Style","Palatino Linotype",Georgia,ui-serif,serif;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono: "SF Mono","Cascadia Code",Consolas,"Roboto Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#141918; --paper-raised:#1B211F; --ink:#E9E7DD; --ink-soft:#A2AEA9; --ink-faint:#6E7975;
      --accent:#5FB79B; --accent-strong:#7FCBB1; --accent-tint:#1E332D;
      --gold:#D9A44C; --gold-tint:#332A17; --good:#5FBE7C; --good-tint:#1C2E20;
      --bad:#E0705A; --bad-tint:#33201B; --line:#2A322F; --line-strong:#3B4643;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -10px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141918; --paper-raised:#1B211F; --ink:#E9E7DD; --ink-soft:#A2AEA9; --ink-faint:#6E7975;
    --accent:#5FB79B; --accent-strong:#7FCBB1; --accent-tint:#1E332D;
    --gold:#D9A44C; --gold-tint:#332A17; --good:#5FBE7C; --good-tint:#1C2E20;
    --bad:#E0705A; --bad-tint:#33201B; --line:#2A322F; --line-strong:#3B4643;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -10px rgba(0,0,0,0.55);
  }
  :root[data-theme="light"]{
    --paper:#EFF1EC; --paper-raised:#F8F9F6; --ink:#1E2B2A; --ink-soft:#52625F; --ink-faint:#7C8A86;
    --accent:#2F6F5E; --accent-strong:#1F4E42; --accent-tint:#DCE9E3;
    --gold:#9C6F1E; --gold-tint:#F1E4C9; --good:#3F8F52; --good-tint:#DEEEE0;
    --bad:#B5432E; --bad-tint:#F6E2DC; --line:#D6DAD3; --line-strong:#B7BdB5;
    --shadow: 0 1px 2px rgba(30,43,42,0.06), 0 6px 20px -8px rgba(30,43,42,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--accent-tint); color:var(--accent-strong); }
  a{ color:var(--accent-strong); }

  .app{ display:grid; grid-template-columns: 232px 1fr; min-height:100vh; max-width:1220px; margin:0 auto; }
  @media (max-width: 780px){ .app{ grid-template-columns: 1fr; } }

  .rail{ border-right:1px solid var(--line); padding:28px 16px 20px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto; }
  @media (max-width:780px){
    .rail{ border-right:none; border-bottom:1px solid var(--line); flex-direction:row; align-items:center; overflow-x:auto; overflow-y:visible; padding:14px 12px; gap:12px; position:static; height:auto; }
  }
  .brand{ font-family:var(--serif); font-size:1.05rem; font-weight:600; letter-spacing:0.2px; display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .brand small{ font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; font-weight:500; }
  .week-progress{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); flex-shrink:0; }
  .week-progress .bar{ width:64px; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  @media (max-width:780px){ .week-progress .bar{ width:44px; } }
  .week-progress .fill{ height:100%; background:var(--accent); transition:width .4s ease; }

  .daylist{ display:flex; flex-direction:column; gap:3px; }
  @media (max-width:780px){ .daylist{ flex-direction:row; } }
  .day-tab{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:1px solid transparent; background:transparent; cursor:pointer; text-align:left; font-family:var(--sans); color:var(--ink-soft); transition:background .15s ease, color .15s ease, border-color .15s ease; white-space:nowrap; width:100%; }
  .day-tab:hover{ background:var(--paper-raised); }
  .day-tab:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .day-tab.active{ background:var(--accent-tint); color:var(--accent-strong); border-color:var(--accent-tint); }
  .day-tab .code{ font-family:var(--mono); font-size:0.72rem; font-weight:600; width:28px; flex-shrink:0; color:inherit; opacity:0.85; }
  .day-tab .tt{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .day-tab .tt b{ font-size:0.82rem; font-weight:600; }
  .day-tab .tt span{ font-size:0.7rem; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .day-tab.active .tt span{ color:var(--accent-strong); opacity:0.75; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--line-strong); flex-shrink:0; margin-left:auto; }
  .status-dot.progress{ background:var(--gold); }
  .status-dot.done{ background:var(--good); }
  .today-flag{ font-family:var(--mono); font-size:0.58rem; text-transform:uppercase; letter-spacing:0.06em; background:var(--gold-tint); color:var(--gold); padding:1px 5px; border-radius:4px; flex-shrink:0; }

  .rail-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  @media (max-width:780px){ .rail-foot{ display:none; } }
  .errlog-btn{ font-family:var(--sans); font-size:0.78rem; color:var(--ink-soft); background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:9px 10px; text-align:left; cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
  .errlog-btn:hover{ border-color:var(--line-strong); }
  .errlog-btn .n{ font-family:var(--mono); font-size:0.7rem; color:var(--ink-faint); background:var(--paper); border-radius:10px; padding:1px 7px; }

  .main{ padding:32px 40px 80px; min-width:0; }
  @media (max-width:780px){ .main{ padding:22px 18px 70px; } }

  .roadmap-box{ margin-bottom:16px; border:1px solid var(--line); border-radius:10px; background:var(--paper-raised); overflow:hidden; }
  .roadmap-toggle{ width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; padding:12px 16px; font-family:var(--serif); font-size:0.95rem; font-weight:600; color:var(--ink); }
  .roadmap-toggle .chevron{ color:var(--ink-faint); transition:transform .2s ease; font-family:var(--sans); }
  .roadmap-box.open .roadmap-toggle .chevron{ transform:rotate(180deg); }
  .roadmap-list{ display:none; padding:0 16px 14px; }
  .roadmap-box.open .roadmap-list{ display:block; }
  .roadmap-row{ display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  .roadmap-row:first-child{ border-top:none; }
  .roadmap-row.current{ background:var(--accent-tint); margin:0 -16px; padding:8px 16px; border-radius:7px; border-top:none; }
  .roadmap-n{ font-family:var(--mono); font-size:0.76rem; color:var(--ink-faint); width:56px; flex-shrink:0; }
  .roadmap-row.current .roadmap-n{ color:var(--accent-strong); }
  .roadmap-t{ display:flex; flex-direction:column; gap:1px; flex:1; }
  .roadmap-t b{ font-size:0.86rem; }
  .roadmap-t span{ font-size:0.76rem; color:var(--ink-faint); }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head h1{ font-family:var(--serif); font-weight:600; font-size:1.7rem; margin:0 0 4px; text-wrap:balance; }
  .eyebrow{ font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--accent); }
  .day-progress{ font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .day-progress .bar{ width:100px; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .day-progress .fill{ height:100%; background:var(--good); transition:width .35s ease; }

  section.block{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-bottom:20px; box-shadow:var(--shadow); }
  section.block h2{ font-family:var(--serif); font-size:1.12rem; font-weight:600; margin:0 0 14px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  section.block h2 .tag{ font-family:var(--mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint); font-weight:500; }
  section.block > p.intro{ color:var(--ink-soft); font-size:0.88rem; margin:-8px 0 16px; }

  /* grammar use-cards */
  .grammar-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .grammar-card{ border:1px solid var(--line); border-radius:10px; padding:16px 17px; background:var(--paper); }
  .grammar-card > .gname{ font-family:var(--serif); font-size:1.02rem; font-weight:600; color:var(--accent-strong); margin-bottom:10px; }
  .struct-table{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--line); }
  .struct-row{ display:grid; grid-template-columns:64px 1fr; gap:8px; align-items:baseline; }
  .struct-row .s-lbl{ font-family:var(--mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); }
  .struct-row .s-val{ font-family:var(--mono); font-size:0.82rem; color:var(--accent-strong); background:var(--accent-tint); border-radius:5px; padding:3px 8px; display:inline-block; }
  .spoken-box{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .spoken-tag{ font-size:0.78rem; color:var(--gold); }
  .spoken-cmp{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .use-item{ margin-bottom:12px; }
  .use-item:last-child{ margin-bottom:0; }
  .use-item .u-title{ font-size:0.87rem; font-weight:600; color:var(--ink); display:flex; gap:6px; align-items:baseline; }
  .use-item .u-title .n{ font-family:var(--mono); font-size:0.72rem; color:var(--accent); flex-shrink:0; }
  .use-item .u-note{ font-size:0.82rem; color:var(--ink-soft); margin:3px 0 6px; }
  .use-item .u-ex{ font-size:0.84rem; color:var(--ink); margin:3px 0 0 2px; padding-left:10px; border-left:2px solid var(--accent-tint); font-style:italic; }

  /* contrast */
  .contrast-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .contrast-row:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  @media (max-width:600px){ .contrast-row{ grid-template-columns:1fr; } }
  .contrast-cell{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .contrast-cell .lbl{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:4px; }
  .contrast-cell .sent{ font-size:0.87rem; color:var(--ink); }
  .contrast-explain{ grid-column:1 / -1; font-size:0.83rem; color:var(--accent-strong); background:var(--accent-tint); border-radius:7px; padding:8px 11px; margin-top:2px; }

  /* mistakes */
  .mistake-item{ padding:10px 0; border-top:1px solid var(--line); }
  .mistake-item:first-child{ border-top:none; padding-top:0; }
  .mistake-item .m-wrong{ color:var(--bad); font-size:0.88rem; text-decoration:line-through; }
  .mistake-item .m-right{ color:var(--good); font-size:0.9rem; font-weight:600; margin-top:3px; }
  .mistake-item .m-why{ color:var(--ink-soft); font-size:0.82rem; margin-top:4px; }

  /* reading links */
  .reading-links{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .reading-link{ display:flex; flex-direction:column; gap:2px; border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:9px 13px; text-decoration:none; flex:1 1 200px; }
  .reading-link:hover{ border-color:var(--accent); }
  .reading-link .rl-title{ font-size:0.86rem; font-weight:600; color:var(--ink); }
  .reading-link .rl-desc{ font-size:0.74rem; color:var(--ink-faint); }
  .reading-hint{ font-size:0.83rem; color:var(--ink-soft); background:var(--gold-tint); color:var(--gold); border-radius:7px; padding:9px 12px; }

  /* exercises */
  .ex{ padding:14px 0; border-top:1px solid var(--line); }
  .ex:first-of-type{ border-top:none; padding-top:0; }
  .ex .qn{ font-size:0.7rem; font-family:var(--mono); color:var(--ink-faint); margin-right:6px; }
  .ex .prompt{ color:var(--ink); font-size:0.94rem; }
  .blank-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .blank-row input[type="text"]{ font-family:var(--sans); font-size:0.92rem; background:var(--paper); color:var(--ink); border:1px solid var(--line-strong); border-radius:7px; padding:6px 10px; min-width:170px; transition:border-color .15s ease, background .15s ease; }
  .blank-row input[type="text"]:focus-visible{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
  .blank-row input.correct{ border-color:var(--good); background:var(--good-tint); }
  .blank-row input.wrong{ border-color:var(--bad); background:var(--bad-tint); }
  .fb-icon{ font-family:var(--mono); font-size:0.85rem; }
  .fb-icon.ok{ color:var(--good); }
  .fb-icon.no{ color:var(--bad); }
  .reveal-text{ font-size:0.85rem; color:var(--ink-soft); margin-top:6px; display:none; background:var(--paper); border-left:3px solid var(--accent); padding:8px 11px; border-radius:0 7px 7px 0; }
  .reveal-text.show{ display:block; }
  .reveal-text b{ color:var(--accent-strong); }

  .corr-item{ margin-top:8px; }
  .corr-item .orig{ font-size:0.9rem; color:var(--ink-soft); font-style:italic; }
  .corr-answer{ margin-top:6px; padding:9px 11px; background:var(--accent-tint); color:var(--accent-strong); border-radius:7px; font-size:0.88rem; display:none; }
  .corr-answer.show{ display:block; }

  button{ font-family:var(--sans); cursor:pointer; }
  .btn{ font-size:0.82rem; font-weight:600; background:var(--accent); color:#fff; border:none; border-radius:7px; padding:8px 14px; transition:background .15s ease, transform .08s ease; }
  .btn:hover{ background:var(--accent-strong); }
  .btn:active{ transform:translateY(1px); }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong); }
  .btn.ghost:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .btn.small{ padding:5px 10px; font-size:0.74rem; }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .score-pill{ font-family:var(--mono); font-size:0.78rem; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:4px 12px; display:inline-flex; align-items:center; gap:6px; }
  .score-pill b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  /* vocab accordion */
  .vocab-stats{ font-family:var(--mono); font-size:0.76rem; color:var(--ink-soft); margin-bottom:12px; }
  .vocab-item{ border:1px solid var(--line); border-radius:10px; margin-bottom:10px; background:var(--paper); overflow:hidden; }
  .vocab-item.mastered{ border-color:var(--good); }
  .vocab-head{ display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; }
  .vocab-head .term{ font-family:var(--serif); font-size:1.03rem; font-weight:600; color:var(--ink); }
  .vocab-head .ipa{ font-family:var(--mono); font-size:0.78rem; color:var(--ink-faint); }
  .vocab-head .pos-badge{ font-family:var(--mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.04em; background:var(--accent-tint); color:var(--accent-strong); padding:2px 7px; border-radius:4px; }
  .vocab-head .reg-badge{ font-family:var(--mono); font-size:0.65rem; color:var(--gold); background:var(--gold-tint); padding:2px 7px; border-radius:4px; }
  .vocab-head .mastered-check{ color:var(--good); font-size:0.9rem; margin-left:auto; flex-shrink:0; }
  .vocab-play{ background:none; border:1px solid var(--line); border-radius:6px; padding:2px 7px; font-size:0.85rem; flex-shrink:0; color:var(--ink-soft); }
  .vocab-play:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .vocab-head .chevron{ margin-left:auto; color:var(--ink-faint); font-size:0.8rem; flex-shrink:0; transition:transform .2s ease; }
  .vocab-item.open .chevron{ transform:rotate(180deg); }
  .vocab-item.open .mastered-check{ margin-left:8px; }
  .vocab-body{ display:none; padding:0 14px 16px; border-top:1px solid var(--line); }
  .vocab-item.open .vocab-body{ display:block; }
  .vf-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; font-size:0.85rem; }
  .vf-row .k{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); width:100%; margin-bottom:2px; }
  .vf-fam{ display:flex; gap:14px; flex-wrap:wrap; }
  .vf-fam span b{ color:var(--ink-faint); font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; margin-right:4px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ background:var(--accent-tint); color:var(--accent-strong); border-radius:12px; padding:3px 10px; font-size:0.8rem; }
  .chip.ant{ background:var(--bad-tint); color:var(--bad); }
  .pattern-box{ font-family:var(--mono); font-size:0.82rem; color:var(--accent-strong); background:var(--accent-tint); border-radius:6px; padding:6px 10px; display:inline-block; }
  .ex-line{ font-size:0.87rem; color:var(--ink); font-style:italic; padding:8px 10px; background:var(--paper-raised); border-radius:6px; margin-top:4px; }
  .ex-line .tag2{ font-family:var(--mono); font-style:normal; font-size:0.65rem; text-transform:uppercase; color:var(--ink-faint); margin-right:6px; }
  .vocab-actions{ display:flex; gap:6px; margin-top:14px; }

  /* writing */
  textarea{ width:100%; min-height:150px; resize:vertical; font-family:var(--sans); font-size:0.94rem; line-height:1.6; background:var(--paper); color:var(--ink); border:1px solid var(--line-strong); border-radius:8px; padding:12px 14px; }
  textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:0; }
  .write-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-family:var(--mono); font-size:0.75rem; color:var(--ink-faint); }
  .write-foot label{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); cursor:pointer; }
  .checklist-box{ margin-top:14px; padding:12px 14px; background:var(--paper); border:1px solid var(--line); border-radius:9px; }
  .checklist-row{ display:flex; align-items:flex-start; gap:8px; font-size:0.85rem; color:var(--ink-soft); padding:4px 0; cursor:pointer; }
  .checklist-row input{ margin-top:3px; flex-shrink:0; }
  .write-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .write-report{ margin-top:14px; padding:14px 16px; background:var(--paper); border:1px solid var(--line); border-radius:9px; }
  .write-report .wr-title{ font-family:var(--serif); font-size:0.94rem; font-weight:600; color:var(--accent-strong); margin-bottom:8px; }
  .write-report .wr-line{ font-size:0.86rem; color:var(--ink-soft); margin-bottom:10px; }
  .write-report .wr-sub{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin:12px 0 6px; }
  .check-grid{ display:flex; flex-wrap:wrap; gap:6px; }
  .check-item{ font-size:0.8rem; border-radius:12px; padding:3px 10px; background:var(--paper-raised); color:var(--ink-faint); border:1px solid var(--line); }
  .check-item.ok{ color:var(--good); border-color:var(--good); background:var(--good-tint); }
  .check-item.no{ color:var(--ink-faint); }
  .warn-item{ border-left:3px solid var(--bad); background:var(--bad-tint); border-radius:0 7px 7px 0; padding:8px 11px; margin-bottom:8px; }
  .warn-item .w-snip{ font-size:0.85rem; color:var(--ink); font-style:italic; }
  .warn-item .w-tip{ font-size:0.8rem; color:var(--bad); margin-top:3px; }

  pron:{title:"Âm cuối /t/ /k/ /p/ — lỗi số 1 của người Việt", why:"Người Việt hay bỏ âm cuối: 'white' thành 'why', 'like' thành 'lie'. Bỏ âm cuối là lý do lớn nhất khiến người bản xứ phải gắng sức nghe. Bật âm cuối NHẸ nhưng PHẢI CÓ.", pairs:[["why","white"],["lie","light"],["sea","seat"],["car","cart"],["row","rope"]], sentence:"I quite like that bright white light at night."},

  sample:"I'm definitely a creature of habit when it comes to mornings. I usually wake up at 6 a.m., but these days I'm trying to get up a little earlier so I have time to exercise. Right now, I'm sticking to a new routine: I check my finances first, then I unwind for ten minutes with coffee before the day gets busy. I always run errands on my way to work if I have time, but on stressful mornings I basically run on autopilot and barely remember driving there. I'm not a night owl at all — by 9 p.m. I'm already getting sleepy."

{

  grammar:[
    { name:"Past Simple", structure:{aff:"S + V2/-ed", neg:"S + did not + V", q:"Did + S + V?"}, uses:[
      {title:"1. Hành động đã kết thúc tại thời điểm xác định", note:"Có mốc thời gian rõ ràng: yesterday, last week, in 2020, at 6pm...", ex:["I finished the report yesterday.","She called me last night.","They moved to Hue in 2019."]},
      {title:"2. Chuỗi hành động liên tiếp (kể chuyện)", note:"Diễn tả các sự việc xảy ra lần lượt, nối tiếp nhau.", ex:["He woke up, brushed his teeth, and left for work.","She opened the door, walked in, and sat down."]},
      {title:"3. Thói quen trong quá khứ nay không còn", note:"Có thể thay bằng 'used to' để nhấn mạnh sự đối lập với hiện tại.", ex:["I played tennis every weekend when I was a kid.","We lived in Da Nang before we moved here."]},
      {title:"4. Sự thật / sự kiện lịch sử", note:"Thời điểm đã qua hẳn, không còn liên hệ ngữ pháp với hiện tại.", ex:["World War II ended in 1945.","Einstein published his theory of relativity in 1905."]}
    ]},
    { name:"Present Perfect", structure:{aff:"S + have/has + V3/-ed", neg:"S + have/has + not + V3/-ed", q:"Have/Has + S + V3/-ed?"}, uses:[
      {title:"1. Kinh nghiệm sống (không nêu thời gian cụ thể)", note:"Trả lời 'đã từng...chưa?' — thường đi với ever/never.", ex:["I have been to Japan twice.","Have you ever tried durian?","She has never lied to me."]},
      {title:"2. Hành động vừa xảy ra, còn ảnh hưởng hiện tại", note:"Đi với just / already / yet.", ex:["I've just finished my homework.","She hasn't arrived yet.","We've already eaten."]},
      {title:"3. Bắt đầu trong quá khứ, còn tiếp diễn/còn giá trị đến hiện tại", note:"for + khoảng thời gian; since + mốc bắt đầu; hoặc trong khoảng thời gian CHƯA kết thúc (this week/month/year).", ex:["I've lived here for five years.","We've had three meetings this week.","She's worked here since 2020."]},
      {title:"4. Tin tức, sự kiện mới chưa có mốc thời gian cụ thể", note:"Thường dùng ở câu mở đầu tin tức; khi kể chi tiết có mốc thời gian, chuyển sang Past Simple.", ex:["Scientists have discovered a new planet.","The government has announced new regulations."]},
      {title:"5. Nhấn kết quả hiện tại của hành động quá khứ", note:"Khác Past Simple ở việc nhấn 'ảnh hưởng ngay bây giờ', không chỉ nêu sự việc đã xảy ra.", ex:["I've lost my keys. (không có chìa khóa lúc này)","Someone has eaten my lunch! (hộp cơm đang trống)"]}
    ]}
  ],
  contrast:[

  pron:{title:"Đuôi -ed: 3 cách đọc /t/ /d/ /ɪd/", why:"Nuốt đuôi -ed khiến người nghe không biết bạn đang nói quá khứ. Sau âm vô thanh → /t/ (worked, stopped, finished); sau âm hữu thanh → /d/ (lived, called, planned); sau /t/ /d/ → /ɪd/ (wanted, decided, needed).", pairs:[["worked /wɜːkt/","lived /lɪvd/"],["stopped /stɒpt/","planned /plænd/"],["finished /ˈfɪnɪʃt/","called /kɔːld/"],["wanted /ˈwɒntɪd/","decided /dɪˈsaɪdɪd/"]], sentence:"Yesterday I worked late, called a client, and decided to rest."},

/* ---------------- listening (TTS) & speaking (speech recognition) ---------------- */

function speak(text, rate){
  if(!window.speechSynthesis) return false;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate || 1;
  window.speechSynthesis.speak(u);
  return true;
}

/* Play/stop toggle for a 🔊 button: click once to play, click again (or click
   a different toggle button) to stop. Only one utterance can play at a time
   anyway (speechSynthesis is a single shared engine), so this also resets
   whichever other toggle button was mid-playback. */
var activeSpeakToggleBtn = null;
function resetSpeakToggleBtn(){
  if(activeSpeakToggleBtn){ activeSpeakToggleBtn.textContent = "🔊"; activeSpeakToggleBtn = null; }
}
function speakToggle(btn, text, rate){
  if(!window.speechSynthesis) return;
  if(activeSpeakToggleBtn === btn){
    window.speechSynthesis.cancel();
    resetSpeakToggleBtn();
    return;
  }
  resetSpeakToggleBtn();
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate || 1;
  u.onend = resetSpeakToggleBtn;
  u.onerror = resetSpeakToggleBtn;
  activeSpeakToggleBtn = btn;
  btn.textContent = "⏹";
  window.speechSynthesis.speak(u);
}

var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;

function scoreOverlap(target, said){
  function toWords(s){ return normalize(s).replace(/[^a-z0-9'\s]/gi,"").split(/\s+/).filter(Boolean); }
  var t = toWords(target), sd = toWords(said);
  if(!t.length) return 0;
  var bag = {};
  sd.forEach(function(w){ bag[w] = (bag[w]||0)+1; });
  var match = 0;
  t.forEach(function(w){ if(bag[w]>0){ match++; bag[w]--; } });
  return Math.round(100*match/t.length);
}

function computeWPM(text, elapsedMs){
  var words = (text||"").trim().match(/\S+/g);
  var n = words ? words.length : 0;
  var minutes = elapsedMs / 60000;
  return minutes > 0 ? Math.round(n / minutes) : 0;
}
function countFillers(text){
  var m = (text||"").match(/\b(um+|uh+|erm+|hmm+)\b/gi);
  return m ? m.length : 0;
}
function wpmBand(wpm){
  if(wpm < 80) return "Còn dịch trong đầu nhiều — tập trung dùng chunks câu giờ thay khoảng lặng.";
  if(wpm <= 110) return "Trôi chảy mức hội thoại tốt. Giữ nhịp này, giảm dần số lần dừng dài.";
  if(wpm <= 150) return "Tiệm cận nhịp bản xứ (bản xứ trò chuyện ~150 wpm).";
  return "Nhanh — kiểm tra lại độ rõ: nói nhanh mà nuốt âm cuối thì khó nghe hơn nói chậm.";
}

/* opts.continuous:true keeps listening across silence (auto-restarts the
   underlying recognizer on each natural onend) so pauseCount/WPM reflect a
   whole multi-sentence answer instead of stopping at the first pause. */
function startRecording(onInterim, onFinal, onError, opts){
  if(!SpeechRec) { if(onError) onError("unsupported"); return null; }
  opts = opts || {};
  var rec = new SpeechRec();
  rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.continuous = !!opts.continuous;
  var finalText = "";
  var startedAt = Date.now();
  var lastSpeechAt = startedAt;
  var pauseCount = 0;
  var stopped = false;
  function metrics(){ return { pauses:pauseCount, elapsedMs:Date.now()-startedAt }; }
  rec.onresult = function(e){
    var now = Date.now();
    if(finalText.trim().length>0 && (now-lastSpeechAt)>2000) pauseCount++;
    lastSpeechAt = now;
    var interim = "";
    for(var i=e.resultIndex; i<e.results.length; i++){
      var tr = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += tr; else interim += tr;
    }
    onInterim(finalText + interim, metrics());
  };
  rec.onerror = function(e){
    if(opts.continuous && !stopped && (e.error==="no-speech" || e.error==="aborted")) return;
    if(onError) onError(e.error);
  };
  rec.onend = function(){
    if(opts.continuous && !stopped){ try{ rec.start(); return; }catch(err){} }
    onFinal(finalText.trim(), metrics());
  };
  try{ rec.start(); }catch(e){ if(onError) onError("start-failed"); return null; }
  return { stop:function(){ stopped = true; try{ rec.stop(); }catch(e){} }, metrics:metrics };
}

var SRS_INTERVAL_DAYS = [0, 1, 3, 7, 14, 30, 60];

function srsIsDue(key){
  var rec = state.srs[key];
  return !rec || rec.dueAt <= Date.now();
}
function srsRecord(key, correct){
  var rec = state.srs[key] || {box:0, dueAt:0, seen:0};
  rec.seen = (rec.seen||0) + 1;
  rec.box = correct ? Math.min(rec.box + 1, SRS_INTERVAL_DAYS.length - 1) : 0;
  rec.dueAt = Date.now() + SRS_INTERVAL_DAYS[rec.box] * 24 * 60 * 60 * 1000;
  state.srs[key] = rec;
  if(rec.box >= 3){ state.vocab[key] = "known"; }
  save();
}
function vocabBaseAnswer(t){
  return t.split(/[\/(]/)[0].trim();
}
/* Returns ALL acceptable typed answers for a vocab term, not just the first
   slash-separated variant (vocabBaseAnswer's cut-at-"/" behaviour rejects
   valid synonyms like "disconnect" in "unplug / disconnect"). Each "/"
   variant is included as-is, plus an article-stripped form ("an early
   bird" → "early bird" too) and an "sth"-stripped form ("get around to
   (doing) sth" → "get around to sth" and "get around to"). */
function vocabAnswers(t){
  var out = [];
  t.split("/").forEach(function(seg){
    var clean = seg.replace(/\([^)]*\)/g, "").replace(/\s+/g," ").trim();
    if(!clean) return;
    out.push(clean);
    var artM = clean.match(/^(?:a|an|the)\s+(.+)$/i);
    if(artM && artM[1].trim()) out.push(artM[1].trim());
    if(/\bsth\b/i.test(clean)){
      var noSth = clean.replace(/\bsth\b/gi,"").replace(/\s+/g," ").trim();
      if(noSth) out.push(noSth);
    }
  });
  var seen = {};
  return out.filter(function(s){ var k=s.toLowerCase(); if(seen[k]) return false; seen[k]=true; return true; });
}
function findClozeFor(v){
  // Only use collocations, never the speak/write example sentences already shown
  // in the accordion — the quiz sentence must be new to the learner, not memorized.
  var answers = vocabAnswers(v.t);
  var pool = (v.colloc || []);
  for(var i=0;i<pool.length;i++){
    for(var j=0;j<answers.length;j++){
      var a = answers[j];
      var idx = pool[i].toLowerCase().indexOf(a.toLowerCase());
      if(idx > -1){
        var real = pool[i].slice(idx, idx+a.length);
        var blanked = pool[i].slice(0,idx) + "_____" + pool[i].slice(idx+a.length);
        return { blanked: blanked, answer: answers };
      }
    }
  }
  return null;
}
/*
 * C2 — Cơ chế ôn liên tuần (chuẩn bị cho Tuần 2 trở đi).
 * getReviewPool() gom mọi thứ người học còn yếu, ưu tiên theo thứ tự:
 *   (1) các entry trong Error Log — lỗi đã tự ghi hoặc do quiz/writing tự động thêm vào
 *   (2) từ vựng (mọi tuần, qua mảng DAYS) chưa được đánh dấu "Đã thuộc"
 *   (3) các câu điền thì (blanks) mà lần gần nhất người học trả lời SAI
 * Từ Tuần 2 trở đi: ngày Thứ 7 (review) nên gọi getReviewPool(), lấy ngẫu nhiên 10-15 mục
 * (ưu tiên errlog trước) rồi trộn vào bộ câu test tổng hợp của tuần đó — tạo hiệu ứng
 * spaced repetition xuyên nhiều tuần thay vì chỉ ôn trong phạm vi 1 tuần.
 * Tuần 1 chưa có UI riêng dùng hàm này (vì chưa có tuần trước để ôn) — hàm được viết sẵn
 * để tái sử dụng ngay khi thêm dữ liệu Tuần 2.
 */
function getReviewPool(){
  var pool = [];
  state.errlog.forEach(function(e){ pool.push({type:"errlog", wrong:e.wrong, right:e.right, why:e.why}); });
  DAYS.forEach(function(d){
    (d.vocab||[]).forEach(function(v,i){
      var k = d.key+"-v"+i;
      if(state.vocab[k]!=="known"){ pool.push({type:"vocab", key:k, term:v.t, meaning:v.m}); }
    });
    (d.blanks||[]).forEach(function(b,i){
      var k = d.key+"-b"+i;
      var val = state.blanks[k];
      if(val && !isCorrect(val, b.a)){ pool.push({type:"blank", key:k, prompt:b.p, answer:b.a[0], why:b.why}); }
    });
  });
  return pool;
}

function buildVocabQuiz(items, limit){
  var qs = [];
  items.forEach(function(v){
    var cloze = findClozeFor(v);
    if(cloze){
      qs.push({ key:v._src+"-v"+v._idx, term:v.t, meaning:v.m, mode:"cloze", prompt:cloze.blanked, answer:cloze.answer });
    } else {
      qs.push({ key:v._src+"-v"+v._idx, term:v.t, meaning:v.m, mode:"meaning", prompt:v.m, answer:vocabAnswers(v.t) });
    }
  });
  for(var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=qs[i]; qs[i]=qs[j]; qs[j]=tmp; }
  return limit ? qs.slice(0,limit) : qs;
}

      icon.className = "fb-icon " + (ok?"ok":"no");
      input.className = ok ? "correct" : "wrong";
      if(!checked){
        checked = true; answeredCount++;
        if(ok) correctCount++;
        var se=document.getElementById(quizKey+"-score"); if(se) se.textContent = correctCount;
        srsRecord(q.key, ok);
        if(!ok && input.value.trim()){
          state.errlog.push({ id:newId(), wrong:"'"+input.value.trim()+"' cho '"+q.term+"'", right:q.answer[0], why:"Nghĩa: "+q.meaning });
          save();
        }
        if(opts.scoreKey){ state.vocabQuiz[opts.scoreKey] = {correct:correctCount, total:questions.length, answered:answeredCount, at:Date.now()}; save(); renderRail(); }
      }
      revealEl.classList.add("show");
    });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") checkBtn.click(); });
    row.appendChild(input); row.appendChild(checkBtn); row.appendChild(icon);
    wrap.appendChild(row); wrap.appendChild(revealEl);
    container.appendChild(wrap);
  });
}

/* ---------------- writing self-check (heuristic, offline) ---------------- */

var PS3SG = ["goes","does","has","works","lives","likes","wants","needs","studies","tries","watches","gets","makes","takes","comes","knows","thinks","believes","seems","looks","feels","means","keeps","starts","closes","opens","leaves","arrives","begins","plays","runs","reads","writes","spends","earns","saves","invests","grows","rises","falls","increases","decreases","costs","pays"];
var IRREG_PAST = ["went","saw","did","had","said","got","made","took","came","knew","thought","found","gave","told","became","showed","left","felt","brought","began","bought","sold","spent","earned","rose","fell","grew","lost","won","paid","held","kept","meant","understood","wrote","spoke","broke","chose","drove","ate","ran","sat","stood","heard","met","built","read"];
var PART = "(?:\\w+ed|\\w+en|been|gone|done|seen|made|taken|known|given|come|found|said|told|thought|shown|written|begun|bought|sold|spent|chosen|driven|run|sat|stood|heard|met|built|read|held|kept|meant|understood|grown|risen|fallen|lost|won|paid|felt)";
var STATIVE = ["knowing","understanding","believing","wanting","needing","loving","liking","hating","preferring","owning","belonging","seeming","realizing","recognizing","remembering","forgetting","meaning","doubting","supposing","containing","consisting","involving","requiring","resembling","depending"];

function getTenseRegex(name){
  var base = (name||"").replace(/\s*\(.*?\)\s*/g,"").trim();
  switch(base){
    case "Present Simple": return new RegExp("\\b(" + PS3SG.join("|") + "|always|usually|often|sometimes|rarely|never|generally|normally)\\b","i");
    case "Present Continuous": return /\b(?:am|is|are)\s+(?!going\s+to\b)\w+ing\b/i;
    case "Past Simple": return new RegExp("\\b(" + IRREG_PAST.join("|") + ")\\b|\\b\\w+ed\\b","i");
    case "Present Perfect": return new RegExp("\\b(?:have|has)\\s+(?:just|already|never|ever|recently|possibly|certainly|not\\s+)?" + PART + "\\b","i");
    case "Present Perfect Continuous": return /\b(?:have|has)\s+been\s+\w+ing\b/i;
    case "Past Perfect": return new RegExp("\\bhad\\s+(?:just|already|never|ever|not\\s+)?" + PART + "\\b","i");
    case "Past Perfect Continuous": return /\bhad\s+been\s+\w+ing\b/i;
    case "will": return /\b(will|won't|'ll)\b/i;
    case "going to": return /\b(?:am|is|are)\s+going\s+to\b/i;
    case "Future Continuous": return /\bwill\s+be\s+\w+ing\b/i;
    default: return null;
  }
}

function splitSentences(text){
  return (text||"").split(/(?<=[.!?])\s+/).map(function(s){return s.trim();}).filter(Boolean);
}

function scanMistakes(text){
  var warnings = [];
  var sentences = splitSentences(text);
  var stativeRe = new RegExp("\\b(?:am|is|are|was|were|been|being)\\s+(" + STATIVE.join("|") + ")\\b","i");
  var pastMarkerRe = /\b(yesterday|ago|last\s+\w+|in\s+(19|20)\d{2})\b/i;
  var havePerfectRe = /\b(have|has)\b(?!\s*n't)(?!\s+to\b)/i;
  var timeClauseWillRe = /\b(when|after|before|until|as soon as)\b[^,.!?]*\bwill\b/i;
  sentences.forEach(function(s){
    if(stativeRe.test(s)){
      warnings.push({snippet:s, tip:"Có thể đang dùng thì tiếp diễn với động từ trạng thái (stative verb) — các động từ như know/understand/want/love/own... thường không chia tiếp diễn."});
    }
    if(havePerfectRe.test(s) && pastMarkerRe.test(s) && !/\bhave\s+to\b/i.test(s)){
      warnings.push({snippet:s, tip:"Câu có 'have/has' kèm mốc thời gian xác định (yesterday/ago/last.../in năm...) — kiểm tra lại, mốc thời gian xác định thường đi với Past Simple, không phải Present Perfect."});
    }
    if(timeClauseWillRe.test(s)){
      warnings.push({snippet:s, tip:"Trong mệnh đề thời gian sau when/after/before/until/as soon as, thường không dùng 'will' — kiểm tra lại xem có bị lặp 'will' không."});
    }
  });
  return warnings;
}

function analyzeWriting(day, text, vocabListOverride){
  var words = (text.trim().match(/\S+/g)||[]).length;
  var tenseHits = [];
  if(day.grammar && day.grammar.length){
    day.grammar.forEach(function(g){
      var re = getTenseRegex(g.name);
      if(re) tenseHits.push({name:g.name, used: re.test(text)});
    });
  }
  var vocabList = vocabListOverride || day.vocab || [];
  var vocabHits = vocabList.map(function(v){
    var stem = v.t.split(/[\/(]/)[0].trim().split(" ")[0];
    var re = new RegExp("\\b" + stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\w*", "i");
    return { term:v.t, used: re.test(text) };
  });
  var warnings = scanMistakes(text);
  return { words:words, tenseHits:tenseHits, vocabHits:vocabHits, warnings:warnings };
}

function dayStatus(d){
  var blankTotal = d.blanks.length, blankDone = 0;
  d.blanks.forEach(function(b,i){ if(isCorrect(state.blanks[d.key+"-b"+i]||"", b.a)) blankDone++; });

  var vocabTotal = d.vocab.length, vocabMastered = 0;
  d.vocab.forEach(function(v,i){ if(state.vocab[d.key+"-v"+i]==="known") vocabMastered++; });

  var writingLen = (state.writing[d.key]||"").trim().split(/\s+/).filter(Boolean).length;
  var hasWriting = !!d.writing && d.type!=="review";
  var writeOk = hasWriting ? (writingLen >= 25) : true;

  var hasQuiz = d.type === "consolidate";
  var quizDone = hasQuiz && !!state.vocabQuiz["vq-"+d.key];
  var hasShadow = !!d.shadowing;
  var shadowDone = hasShadow && !!state.shadow[d.key];
  var hasPron = !!d.pron;
  var pronDone = hasPron && !!state.pron[d.key];

  var pieces = blankTotal + vocabTotal + (hasWriting?1:0) + (hasQuiz?1:0) + (hasShadow?1:0) + (hasPron?1:0);
  var piecesDone = blankDone + vocabMastered + (hasWriting && writeOk ? 1:0) + (quizDone?1:0) + (shadowDone?1:0) + (pronDone?1:0);
  var pct = pieces>0 ? Math.round(100*piecesDone/pieces) : 0;
  var started = blankDone>0 || vocabMastered>0 || writingLen>0 || quizDone || shadowDone || pronDone || d.blanks.some(function(b,i){ return !!state.blanks[d.key+"-b"+i]; });

  return { pct:pct, complete: pieces>0 && piecesDone>=pieces, started: started };
}
function weekPct(){ var s=0; DAYS.forEach(function(d){ s+=dayStatus(d).pct; }); return Math.round(s/DAYS.length); }

  var list = document.getElementById("daylist");
  list.innerHTML = "";
  DAYS.forEach(function(d){
    var st = dayStatus(d);
    var btn = document.createElement("button");
    btn.className = "day-tab" + (state.current===d.key ? " active":"");
    var dotClass = st.complete ? "done" : (st.started ? "progress" : "");
    btn.innerHTML =
      '<span class="code">'+d.code+'</span>'+
      '<span class="tt"><b>'+d.label+'</b><span>'+d.topic+'</span></span>'+
      (d.weekday===todayWeekday ? '<span class="today-flag">Hôm nay</span>' : '')+
      '<span class="status-dot '+dotClass+'"></span>';
    btn.addEventListener("click", function(){
      state.current = d.key; save(); renderAll();
      window.scrollTo(0,0);
    });
    list.appendChild(btn);
  });
  var wp = weekPct();
  document.getElementById("weekFill").style.width = wp+"%";
  document.getElementById("weekPct").textContent = wp+"%";
  document.getElementById("errCount").textContent = state.errlog.length;
  document.getElementById("fluencyCount").textContent = state.fluency.length;
}

function currentDay(){
  var todayMatch = DAYS.find(function(d){return d.weekday===todayWeekday;});
  var key = state.current || (todayMatch ? todayMatch.key : DAYS[0].key);
  return DAYS.find(function(d){ return d.key===key; }) || DAYS[0];

                  save();

              }, function(){ recBtn2.textContent = "🎤 Ghi âm"; active2 = null; }, {continuous:true});

              if(active2){ active2.stop(); return; }
              if(!opts.countdown){ reallyStart(); return; }
              var n = 3;
              recBtn2.disabled = true;
              recBtn2.textContent = "Nói ngay sau... " + n;
              var iv = setInterval(function(){
                n--;
                if(n<=0){ clearInterval(iv); recBtn2.disabled = false; reallyStart(); }

/* ---------------- error log panel ---------------- */
function renderErrLog(){

/* active-recall / spaced-repetition quiz over the learner's own logged mistakes,
   reusing the same SRS box system already built for vocab (srsIsDue/srsRecord). */
function renderErrlogQuiz(){
  var box = document.getElementById("errlogQuiz");
  if(!box) return;
  box.innerHTML = "";
  var needsSave = false;
  state.errlog.forEach(function(en){ if(!en.id){ en.id = newId(); needsSave = true; } });
  if(needsSave) save();
  if(state.errlog.length===0) return;
  var due = state.errlog.filter(function(en){ return srsIsDue("errlog-"+en.id); });
  box.appendChild(el("div","wr-sub","Ôn tập chủ động (Spaced Repetition) — "+due.length+" mục đến hạn / "+state.errlog.length+" tổng"));
  if(due.length===0){
    box.appendChild(el("div","empty-note","Chưa có mục nào đến hạn ôn — quay lại sau."));
    return;
  }
  var quizArea = el("div",null);
  var startBtn = el("button","btn small","Ôn "+Math.min(10,due.length)+" mục đến hạn");
  startBtn.addEventListener("click", function(){
    var qs = due.slice();
    for(var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
    runErrlogQuiz(quizArea, qs.slice(0,10));
  });
  box.appendChild(startBtn);
  box.appendChild(quizArea);
}

function runErrlogQuiz(container, items){
  container.innerHTML = "";
  var scoreEl = el("div","score-pill","Đúng <b id='eq-score'>0</b> / "+items.length);
  scoreEl.style.marginTop = "8px";
  container.appendChild(scoreEl);
  var correctCount = 0;
  items.forEach(function(en, i){
    var wrap = el("div","ex");
    wrap.appendChild(el("div",null,'<span class="qn">'+(i+1)+'.</span><span class="prompt">Sửa câu sai: <i>"'+en.wrong+'"</i></span>'));
    var row = el("div","blank-row");
    var input = document.createElement("input");
    input.type = "text"; input.placeholder = "Viết lại câu đúng...";
    input.style.minWidth = "200px"; input.style.flex = "1";
    var icon = el("span","fb-icon");
    var revealEl = el("div","reveal-text","<b>Đáp án:</b> "+en.right+(en.why ? "<br><b>Vì sao:</b> "+en.why : ""));
    var checked = false;
    var checkBtn = el("button","btn small","Kiểm tra");
    checkBtn.addEventListener("click", function(){
      var sc = scoreOverlap(en.right, input.value);
      var ok = sc >= 70;
      icon.textContent = (ok?"✓ ":"") + sc + "%";
      icon.className = "fb-icon " + (ok?"ok":"no");
      input.className = ok ? "correct" : "wrong";
      if(!checked){
        checked = true; if(ok) correctCount++;
        var se = document.getElementById("eq-score"); if(se) se.textContent = correctCount;
        srsRecord("errlog-"+en.id, ok);
      }
      revealEl.classList.add("show");
    });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") checkBtn.click(); });
    row.appendChild(input); row.appendChild(checkBtn); row.appendChild(icon);
    wrap.appendChild(row); wrap.appendChild(revealEl);
    container.appendChild(wrap);
  });
}

function openErrLog(){ document.getElementById("errlogOverlay").classList.add("open"); renderErrLog(); renderErrlogQuiz(); }

  });

function startFreeTalkRecording(goBtn, timeLbl, container){
  goBtn.textContent = "⏹ Dừng lại";
  var remaining = 60;
  timeLbl.textContent = remaining+"s";
  freeTalkState.countdownId = setInterval(function(){
    remaining--; timeLbl.textContent = Math.max(remaining,0)+"s";
    if(remaining<=0){ clearInterval(freeTalkState.countdownId); if(freeTalkState.rec) freeTalkState.rec.stop(); }
  }, 1000);
  freeTalkState.rec = startRecording(function(interim){ freeTalkState.transcript = interim; }, function(finalText, m){
    clearInterval(freeTalkState.countdownId);
    freeTalkState.rec = null;
    var words = (finalText.trim().match(/\S+/g)||[]).length;
    var wpm = computeWPM(finalText, m.elapsedMs);
    freeTalkState.transcript = finalText;
    freeTalkState.lastResult = { wpm:wpm, pauses:m.pauses, words:words };
    state.freetalk.push({ at:Date.now(), topic:freeTalkState.topic, wpm:wpm, pauses:m.pauses, words:words });
    if(state.freetalk.length>50) state.freetalk = state.freetalk.slice(-50);
    save();
    renderFreeTalk(container);
  }, function(){
    clearInterval(freeTalkState.countdownId);
    freeTalkState.rec = null;
    renderFreeTalk(container);
  }, {continuous:true});
  freeTalkState.timerId = setTimeout(function(){ if(freeTalkState.rec) freeTalkState.rec.stop(); }, 60000);
}

function renderFreeTalk(container){
  container.innerHTML = "";
  var pickBtn = el("button","btn small","🎲 Chọn chủ đề ngẫu nhiên");
  pickBtn.addEventListener("click", function(){
    freeTalkState.topic = FREETALK_TOPICS[Math.floor(Math.random()*FREETALK_TOPICS.length)];
    freeTalkState.transcript = ""; freeTalkState.lastResult = null;
    renderFreeTalk(container);
  });
  if(!freeTalkState.topic){
    container.appendChild(pickBtn);
    renderFreeTalkHistory(container);
    return;
  }
  container.appendChild(el("div","prompt-box","<b>Chủ đề</b>"+freeTalkState.topic));
  var ctr = el("div","dict-controls");
  var timeLbl = el("span","score-pill","60s");
  if(SpeechRec){
    var goBtn = el("button","btn small","🎤 Bắt đầu (đếm ngược 3s rồi nói 60s)");
    goBtn.addEventListener("click", function(){
      if(freeTalkState.rec){ freeTalkState.rec.stop(); return; }

    });

    container.appendChild(el("div","empty-note","Cần Chrome/Edge để ghi âm và tính chỉ số tự động."));
  }

  ctr.appendChild(newTopicBtn);
  container.appendChild(ctr);
  if(freeTalkState.lastResult){
    var r = freeTalkState.lastResult;
    container.appendChild(el("div","score-pill","🗣 "+r.wpm+" từ/phút · ⏸ "+r.pauses+" lần dừng >2s · "+r.words+" từ"));

  }

/* ---------------- forced chunk-usage drill ---------------- */

function renderChunkDrill(container, d){
  if(chunkDrillState.dayKey !== d.key){ chunkDrillState.dayKey = d.key; chunkDrillState.chunk = null; chunkDrillState.prompt = null; }
  container.innerHTML = "";
  var stats = state.chunkDrill;
  container.appendChild(el("div","wr-sub","Luyện phản xạ dùng chunk"+(stats.attempts?(" · đã thử "+stats.attempts+" lần, dùng đúng "+stats.hits+" lần"):"")));
  var promptPool = (d.speaking && d.speaking.length) ? d.speaking : FLUENCY_QUESTIONS;
  var startBtn = el("button","btn small","🎲 Bắt đầu (chunk + câu hỏi ngẫu nhiên)");
  startBtn.addEventListener("click", function(){
    chunkDrillState.chunk = d.chunks[Math.floor(Math.random()*d.chunks.length)];
    chunkDrillState.prompt = promptPool[Math.floor(Math.random()*promptPool.length)];
    renderChunkDrill(container, d);
  });
  if(!chunkDrillState.chunk){ container.appendChild(startBtn); return; }
  container.appendChild(el("div","prompt-box","<b>Câu hỏi</b>"+chunkDrillState.prompt));
  container.appendChild(el("div",null,'Bắt buộc dùng chunk này trong câu trả lời: <span class="pattern-box">'+chunkDrillState.chunk.t+'</span>'));
  var ctr = el("div","dict-controls"); ctr.style.marginTop = "8px";
  var result = el("span","score-pill",""); result.style.display = "none";
  if(SpeechRec){
    var recBtn = el("button","btn small","🎤 Trả lời (đếm ngược 3s)");
    var active = null;
    recBtn.addEventListener("click", function(){
      if(active){ active.stop(); return; }
      var n = 3; recBtn.disabled = true; recBtn.textContent = "Nói ngay sau... " + n;
      var iv = setInterval(function(){
        n--;
        if(n<=0){
          clearInterval(iv); recBtn.disabled = false; recBtn.textContent = "⏹ Đang nghe...";
          active = startRecording(function(){}, function(finalText){
            recBtn.textContent = "🎤 Trả lời (đếm ngược 3s)"; active = null;
            if(finalText){
              var used = finalText.toLowerCase().indexOf(chunkDrillState.chunk.t.toLowerCase()) > -1;
              stats.attempts++; if(used) stats.hits++;
              save();
              result.style.display = "inline-flex";
              result.innerHTML = (used ? "✓ Đã dùng chunk" : "✗ Chưa nghe thấy chunk") + ' — bạn nói: "' + finalText + '"';
            }
          }, function(){ recBtn.textContent = "🎤 Trả lời (đếm ngược 3s)"; active = null; });
        } else recBtn.textContent = "Nói ngay sau... " + n;
      }, 700);
    });
    ctr.appendChild(recBtn);
  } else {
    container.appendChild(el("div","empty-note","Cần Chrome/Edge để tự động kiểm tra chunk trong câu trả lời."));
  }
  var nextBtn = el("button","btn ghost small","Chunk khác");
  nextBtn.addEventListener("click", function(){ chunkDrillState.chunk = null; renderChunkDrill(container, d); });
  ctr.appendChild(nextBtn);
  ctr.appendChild(result);
  container.appendChild(ctr);
}

    return '<div class="review-list"><div class="item">'+
      '<span>'+new Date(f.at).toLocaleDateString("vi-VN")+'</span>'+
      '<span>'+(f.wpm?('🗣 <b>'+f.wpm+'</b> từ/phút · '):'')+'Dừng >2s: <b>'+f.pauses+'</b> · Dịch trong đầu: <b>'+f.translating+'</b> · Chunks: <b>'+f.chunksUsed+'</b></span>'+
      '</div></div>';
  }).join("");
  box.innerHTML = rows;
}

function renderFluencyBody(){
  var body = document.getElementById("fluencyBody");
  body.innerHTML = "";
  var startBtn = el("button","btn small","🎲 Bắt đầu (chọn câu hỏi ngẫu nhiên)");
  startBtn.addEventListener("click", function(){
    fluencyState.question = FLUENCY_QUESTIONS[Math.floor(Math.random()*FLUENCY_QUESTIONS.length)];
    fluencyState.transcript = "";
    renderFluencyBody();
  });
  if(!fluencyState.question){
    body.appendChild(startBtn);
    body.appendChild(el("div","empty-note","Pool có "+FLUENCY_QUESTIONS.length+" câu hỏi — bạn sẽ không biết trước câu nào được chọn."));
    return;
  }
  body.appendChild(el("div","prompt-box","<b>Câu hỏi của bạn</b>"+fluencyState.question));
  var ta = document.createElement("textarea");
  ta.placeholder = "Transcript sẽ hiện ở đây khi bạn ghi âm (tối đa 3 phút, tự dừng nếu bạn dừng nói)...";
  ta.value = fluencyState.transcript;
  ta.addEventListener("input", function(){ fluencyState.transcript = ta.value; });
  var ctr = el("div","dict-controls");
  var statPill = el("span","score-pill","");
  statPill.style.display = "none";
  if(SpeechRec){
    var recBtn = el("button","btn small","🎤 Bắt đầu ghi âm (tối đa 3 phút)");
    recBtn.addEventListener("click", function(){
      if(fluencyState.rec){ fluencyState.rec.stop(); return; }
      recBtn.textContent = "⏹ Đang ghi (tối đa 3:00)...";
      fluencyState.rec = startRecording(function(interim){ ta.value = interim; fluencyState.transcript = interim; }, function(finalText, m){
        fluencyState.rec = null; recBtn.textContent = "🎤 Bắt đầu ghi âm (tối đa 3 phút)";
        clearTimeout(fluencyState.timerId);
        if(finalText){
          ta.value = finalText; fluencyState.transcript = finalText;
          pausesInp.value = m.pauses;
          var wpm = computeWPM(finalText, m.elapsedMs);
          statPill.style.display = "inline-flex";
          statPill.innerHTML = "🗣 <b>"+wpm+"</b> từ/phút · ⏸ tự đếm <b>"+m.pauses+"</b> lần dừng &gt;2s";
          statPill.dataset.wpm = wpm;
          var dChunks = currentDay().chunks || [];
          var lower = finalText.toLowerCase();
          var hits = dChunks.filter(function(c){ return lower.indexOf(c.t.toLowerCase())>-1; }).length;
          chunksInp.value = hits;
        }
      }, function(){ fluencyState.rec = null; recBtn.textContent = "🎤 Bắt đầu ghi âm (tối đa 3 phút)"; clearTimeout(fluencyState.timerId); }, {continuous:true});
      fluencyState.timerId = setTimeout(function(){ if(fluencyState.rec) fluencyState.rec.stop(); }, 180000);
    });
    ctr.appendChild(recBtn);
  }
  var newQBtn = el("button","btn ghost small","Đổi câu hỏi khác");
  newQBtn.addEventListener("click", function(){ fluencyState.question = null; renderFluencyBody(); });
  ctr.appendChild(newQBtn);
  ctr.appendChild(statPill);
  body.appendChild(ctr);
  body.appendChild(ta);

  body.appendChild(el("div","wr-sub","Số lần dừng &amp; chunks đã tự động điền từ bản ghi — chỉnh lại nếu thấy sai. Mục dịch trong đầu vẫn cần tự đánh giá."));
  var metricsRow = el("div","dict-controls");
  function numField(labelText, id){
    var lbl = document.createElement("label"); lbl.className = "pause-count-label";
    lbl.appendChild(document.createTextNode(labelText+": "));
    var inp = document.createElement("input"); inp.type="number"; inp.min="0"; inp.style.width="56px"; inp.id=id;
    lbl.appendChild(inp);
    metricsRow.appendChild(lbl);
    return inp;
  }
  var pausesInp = numField("Số lần dừng >2s", "fl-pauses");
  var translatingInp = numField("Số lần thấy mình dịch trong đầu", "fl-translating");
  var chunksInp = numField("Số chunks dùng tự nhiên", "fl-chunks");
  body.appendChild(metricsRow);

  var saveBtn = el("button","btn small","Lưu kết quả lần đo này");
  saveBtn.style.marginTop = "10px";
  saveBtn.addEventListener("click", function(){
    state.fluency.push({
      at: Date.now(), question: fluencyState.question, transcript: fluencyState.transcript,
      pauses: Number(pausesInp.value)||0, translating: Number(translatingInp.value)||0, chunksUsed: Number(chunksInp.value)||0,
      wpm: Number(statPill.dataset.wpm)||0
    });
    save();
    fluencyState.question = null; fluencyState.transcript = "";
    renderFluencyBody(); renderFluencyHistory(); renderRail();
  });
  body.appendChild(saveBtn);
}

/* ---------------- Hỏi đáp nhanh (general Q&A, separate from the fluency-practice chat) ---------------- */

function renderQAChatLog(logEl){
  var hist = state.qa;
  logEl.innerHTML = "";
  if(hist.length===0){
    logEl.appendChild(el("div","empty-note","Chưa có câu hỏi nào — gõ hoặc dùng micro để bắt đầu."));
  }
  hist.forEach(function(m){
    var bubble = el("div","chat-bubble "+(m.role==="user"?"me":"ai"));
    bubble.appendChild(el("div","chat-text",m.content));
    if(m.role==="assistant"){
      var replayBtn = el("button","chat-replay","🔊");
      replayBtn.title = "Nghe lại (bấm lần nữa để dừng)";
      replayBtn.addEventListener("click", function(){ speakToggle(replayBtn, m.content, 0.95); });
      bubble.appendChild(replayBtn);
    }
    logEl.appendChild(bubble);
  });
  logEl.scrollTop = logEl.scrollHeight;
}

function renderQA(){
  var body = document.getElementById("qaBody");
  body.innerHTML = "";
  var logEl = el("div","chat-log");
  body.appendChild(logEl);
  renderQAChatLog(logEl);
  var statusEl = el("div","chat-status","");
  body.appendChild(statusEl);

  async function sendQA(text){
    if(!text || !text.trim()) return;
    state.qa.push({role:"user", content:text.trim()});
    save(); renderQAChatLog(logEl);
    statusEl.textContent = "AI đang trả lời...";
    try{
      var res = await fetch(AI_WORKER_URL.replace(/\/chat$/,"/ask"), {
        method:"POST",
        headers:{"content-type":"application/json"},
        body: JSON.stringify({
          context: currentDay().topic,
          history: state.qa.slice(0,-1),
          message: text.trim()
        })
      });
      var data = await res.json();
      if(!res.ok || !data.reply){
        statusEl.textContent = "Lỗi: " + (data.error==="upstream_error" ? "backend/API key có thể chưa cấu hình xong" : (data.error || "không kết nối được"));
        return;
      }
      state.qa.push({role:"assistant", content:data.reply});
      save(); renderQAChatLog(logEl);
      statusEl.textContent = "";
    }catch(e){
      statusEl.textContent = "Không kết nối được tới backend — kiểm tra lại kết nối mạng.";
    }
  }

  var ctr = el("div","dict-controls");
  var typed = document.createElement("input");
  typed.type = "text"; typed.placeholder = "Gõ câu hỏi của bạn...";
  typed.style.flex = "1"; typed.style.minWidth = "180px";
  typed.addEventListener("keydown", function(e){ if(e.key==="Enter" && typed.value.trim()){ sendQA(typed.value); typed.value=""; } });
  ctr.appendChild(typed);
  var sendBtn = el("button","btn small","Gửi");
  sendBtn.addEventListener("click", function(){ if(typed.value.trim()){ sendQA(typed.value); typed.value=""; } });
  ctr.appendChild(sendBtn);
  if(SpeechRec){
    var micBtn = el("button","btn ghost small","🎤 Nói");
    var activeRec = null;
    micBtn.addEventListener("click", function(){
      if(activeRec){ activeRec.stop(); return; }
      micBtn.textContent = "⏹ Đang nghe...";
      activeRec = startRecording(function(interim){ typed.value = interim; }, function(finalText){
        micBtn.textContent = "🎤 Nói"; activeRec = null;
        if(finalText){ typed.value = ""; sendQA(finalText); }
      }, function(){ micBtn.textContent = "🎤 Nói"; activeRec = null; });
    });
    ctr.appendChild(micBtn);
  } else {
    body.appendChild(el("div","empty-note","Ghi âm cần Chrome/Edge. Bạn vẫn có thể gõ chữ để hỏi."));
  }
  var clearBtn = el("button","btn ghost small","Xóa hội thoại");
  clearBtn.addEventListener("click", function(){ state.qa = []; save(); renderQAChatLog(logEl); });
  ctr.appendChild(clearBtn);
  body.appendChild(ctr);
}

function openQA(){ document.getElementById("qaOverlay").classList.add("open"); renderQA(); }
function closeQA(){ document.getElementById("qaOverlay").classList.remove("open"); }

function openFluency(){ document.getElementById("fluencyOverlay").classList.add("open"); renderFluencyBody(); renderFluencyHistory(); }
function closeFluency(){ document.getElementById("fluencyOverlay").classList.remove("open"); }
document.getElementById("openFluency").addEventListener("click", openFluency);
document.getElementById("closeFluency").addEventListener("click", closeFluency);
document.getElementById("fluencyOverlay").addEventListener("click", function(e){ if(e.target===this) closeFluency(); });

document.getElementById("fabQA").addEventListener("click", openQA);
document.getElementById("closeQA").addEventListener("click", closeQA);
document.getElementById("qaOverlay").addEventListener("click", function(e){ if(e.target===this) closeQA(); });

document.getElementById("openErrLog").addEventListener("click", openErrLog);
document.getElementById("fabErrLog").addEventListener("click", openErrLog);
document.getElementById("closeErrLog").addEventListener("click", closeErrLog);
document.getElementById("errlogOverlay").addEventListener("click", function(e){ if(e.target===this) closeErrLog(); });
document.getElementById("ef-add").addEventListener("click", function(){
  var w = document.getElementById("ef-wrong").value.trim();
  var r = document.getElementById("ef-right").value.trim();
  var y = document.getElementById("ef-why").value.trim();
  if(!w || !r) return;
  state.errlog.push({id:newId(), wrong:w, right:r, why:y});
  save();
  document.getElementById("ef-wrong").value=""; document.getElementById("ef-right").value=""; document.getElementById("ef-why").value="";
  renderErrLog(); renderRail();
});

if(!state.current){
  var todayDay = DAYS.find(function(d){ return d.weekday===todayWeekday; });
  state.current = todayDay ? todayDay.key : DAYS[0].key;
}
renderAll();

})();
</script>
